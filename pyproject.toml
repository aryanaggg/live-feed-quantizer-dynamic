[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live-feed-quantizer"
version = "1.0.0"
description = "Real-time camera feed quantized with audio-driven color palettes"
requires-python = ">=3.11"
keywords = ["camera", "quantization", "audio", "webgl", "fastapi"]

dependencies = [
    "fastapi>=0.123.0",
    "uvicorn[standard]>=0.38.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "Pillow>=12.0.0",
    "librosa>=0.11.0",
    "scipy>=1.16.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.6",
    "tinytuya>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "httpx==0.27.2",
    "concurrently>=10.0.6",
]

[project.scripts]
backend = "server:main"
start = "server:main"

[tool.setuptools.packages.find]
where = ["."]