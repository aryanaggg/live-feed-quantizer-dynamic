<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Feed Quantizer</title>
<style>
:root{--lvl:0;--e:cubic-bezier(.22,1,.36,1);--s:cubic-bezier(.34,1.56,.64,1);--mut:rgba(255,255,255,.55)}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;color:#f4f4f8;font:13px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
body.idle{cursor:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

#grid{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body.ov #grid{z-index:2;mix-blend-mode:screen;pointer-events:none}
#cv{position:fixed;z-index:1;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s var(--e)}
body.on #cv{opacity:1}
#hint{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--mut);pointer-events:none;transition:opacity .5s;animation:pulse 3.4s ease-in-out infinite}
body.on #hint{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.45}}

.glass{background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.ui{transition:opacity .5s var(--e),transform .7s var(--e)}
body.idle .ui{opacity:0;transform:translateY(14px)}
body.idle #top{transform:translateY(-14px)}
body.idle.err .ui{opacity:1;transform:none}

#top{position:fixed;top:16px;left:16px;z-index:5;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:99px}
#dot{width:7px;height:7px;border-radius:50%;background:var(--mut);transition:background .4s}
body.on #dot{background:#5ee3a1;animation:ping 1.8s ease-out infinite}
body.err #dot{background:#ff6b6b;animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,227,161,.6)}100%{box-shadow:0 0 0 9px rgba(94,227,161,0)}}
#st,#fps{color:var(--mut);font-variant-numeric:tabular-nums}
body.err #st{color:#ff8b8b}

#dock{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:6;display:flex;align-items:center;gap:10px;padding:9px;border-radius:34px;max-width:96vw;
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.go,.ic{display:grid;place-items:center;border-radius:50%;transition:transform .45s var(--s),background .2s}
.go{width:54px;height:54px;background:#fff;color:#000;flex:none}
.ic{width:42px;height:42px;background:rgba(255,255,255,.1);flex:none}
.ic:hover{background:rgba(255,255,255,.2)}.ic.on{background:#fff;color:#000}
.go:hover,.ic:hover{transform:scale(1.08)}.go:active,.ic:active{transform:scale(.9)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go svg{fill:currentColor;stroke:none;width:22px;height:22px}
.go .s,body.on .go .p{display:none}body.on .go .s{display:block}

.seg{position:relative;display:flex;padding:4px;border-radius:99px;background:rgba(0,0,0,.25);overflow-x:auto;scrollbar-width:none;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg .hl{position:absolute;left:0;top:4px;bottom:4px;border-radius:99px;background:#fff;transition:transform .55s var(--s),width .55s var(--s)}
.seg button{position:relative;padding:9px 14px;border-radius:99px;white-space:nowrap;color:var(--mut);transition:color .3s}
.seg button.on{color:#000;font-weight:600}
#sw{display:none;gap:3px;padding:0 4px}
body.on #sw{display:flex}
#sw span{width:8px;height:30px;border-radius:4px}

#tune,#devices{position:fixed;left:50%;bottom:104px;translate:-50% 0;z-index:6;width:min(330px,90vw);display:grid;gap:14px;padding:18px;border-radius:24px;
  opacity:0;transform:translateY(10px) scale(.94);transform-origin:50% 100%;pointer-events:none;transition:opacity .25s,transform .55s var(--s)}
#tune.open,#devices.open{opacity:1;transform:none;pointer-events:auto}
body.idle #tune.open,body.idle #devices.open{opacity:0}
#devices label{display:grid;gap:6px;color:var(--mut);font-size:12px}
#devices select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:inherit;font:inherit}
#devices select:focus-visible{outline:2px solid #fff;outline-offset:2px}
#devNote{color:var(--mut);font-size:11px}
.ic.off{opacity:.4}
.row{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:10px}
.row label{color:var(--mut)}.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;cursor:pointer;background:linear-gradient(90deg,#fff var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}

@media(max-width:640px){body.on #sw,#fps{display:none}.ic{width:38px;height:38px}#mr,#gd,#fs,#integration{display:none}.seg button{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="grid"></canvas>
<canvas id="cv"></canvas>
<video id="vid" playsinline muted style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<div id="hint">Press start</div>

<div class="glass ui" id="top"><span id="dot"></span><b>Live Feed Quantizer</b><span id="st">Ready</span><span id="fps"></span></div>

<div class="glass ui" id="tune">
  <div class="row"><label for="sPix">Pixels</label><input id="sPix" type="range" min="2" max="40" step="1" value="10"><output></output></div>
  <div class="row"><label for="sSens">Sense</label><input id="sSens" type="range" min=".3" max="3" step=".1" value="1"><output></output></div>
  <div class="row"><label for="sResp">Flow</label><input id="sResp" type="range" min=".03" max=".5" step=".01" value=".12"><output></output></div>
  <div class="row"><label>Preset</label><input id="presetName" type="text" placeholder="name" style="flex:1"><button id="presetSave">Save</button></div>
  <div class="row"><label>Load</label><select id="presetList" style="flex:1"></select><button id="presetLoad">Load</button></div>
</div>

<div class="glass ui" id="devices">
  <label>Camera<select id="camSelect"></select></label>
  <label>Microphone<select id="micSelect"></select></label>
  <small id="devNote"></small>
</div>

<div class="glass ui" id="dock">
  <button class="go" id="go" aria-label="Start / stop"><svg class="p" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="s" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
  <div class="seg" id="seg"><i class="hl"></i></div>
  <div id="sw"></div>
  <button class="ic" id="camBtn" title="Camera devices" aria-label="Camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
  <button class="ic" id="micBtn" title="Microphone (mute)" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
  <button class="ic" id="tb" title="Tune" aria-label="Tune"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button class="ic on" id="mr" title="Mirror (M)" aria-label="Mirror"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/></svg></button>
  <button class="ic" id="gd" title="Grid overlay (G)" aria-label="Grid overlay"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="18" cy="6" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18" cy="12" r="1.4"/><circle cx="6" cy="18" r="1.4"/><circle cx="12" cy="18" r="1.4"/><circle cx="18" cy="18" r="1.4"/></svg></button>
  <button class="ic" id="fs" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ic" id="integration" title="Integrations" aria-label="Integrations"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.5"/></svg></button>
</div>

<div class="glass ui" id="integrations-panel" style="position:fixed;right:22px;bottom:90px;width:320px;max-height:60vh;overflow:auto;padding:16px;z-index:7;opacity:0;pointer-events:none;transform:translateY(10px) scale(.94);transition:opacity .2s ease, transform .2s ease;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
    <h3 style="margin:0;font-size:16px;">Integrations</h3>
    <button class="ic" id="close-integrations" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="seg" id="integration-tabs" style="width:100%;margin-bottom:12px;"></div>
  <div id="integration-tab-content"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const cv = $('#cv'), vid = $('#vid'), body = document.body;
const MODES = ['Palette', 'Dither', 'Halftone', 'Gradient', 'Ripple'];
const PRESETS = Array.from({ length: 5 }, () => ({ pix: 10, sens: 1, resp: 0.12 }));
let S = PRESETS[0];
let mode = 0, mirror = 1, ov = false, run = false, stream = null, starting = false;
const selected = { video: '', audio: '' };   // chosen deviceIds ('' = browser default)
let micMuted = false, hasMic = false;

/* ---------- start / stop ---------- */
function status(msg, err) { $('#st').textContent = msg; body.classList.toggle('err', !!err); }
async function start() {
  if (run || starting) return;
  starting = true;
  const v = { width: { ideal: 1280 }, height: { ideal: 720 } };
  if (selected.video) v.deviceId = { exact: selected.video };
  // AGC / noise suppression off: keeps the real dynamics the palette reacts to.
  const a = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  if (selected.audio) a.deviceId = { exact: selected.audio };
  try {
    let s, noMic = false;
    try {
      s = await navigator.mediaDevices.getUserMedia({ video: v, audio: a });
    } catch (e) {
      try {
        s = await navigator.mediaDevices.getUserMedia({ video: v, audio: true });
      } catch (e2) {
        try {
          s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (e3) {
          s = await navigator.mediaDevices.getUserMedia({ video: true }); noMic = true;
        }
      }
    }
    stream = s; vid.srcObject = s;
    hasMic = s.getAudioTracks().length > 0;
    const vt = s.getVideoTracks()[0], at = s.getAudioTracks()[0];
    if (vt) { const id = (vt.getSettings() || {}).deviceId; if (id) selected.video = id; }
    if (at) { const id = (at.getSettings() || {}).deviceId; if (id) selected.audio = id; }
    refreshDevices();
    // play() can reject when a previous source was just replaced; the frames still arrive.
    vid.play().catch(() => {});
    if (s.getAudioTracks().length) {
      ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
      an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = .4;
      ac.createMediaStreamSource(s).connect(an);
      fd = new Uint8Array(an.frequencyBinCount); sr = ac.sampleRate;
    }
    run = true; body.classList.add('on'); wake();
    status(noMic ? 'Live · no mic, palette drifts' : 'Live');
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; vid.srcObject = null;
    if (ac) { ac.close(); ac = an = null; }
    status('Camera error: ' + e.message, true);
  } finally { starting = false; }
}
function stop() {
  run = false; starting = false; body.classList.remove('on', 'idle');
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; vid.srcObject = null;
  if (ac) { ac.close(); ac = an = null; } $('#fps').textContent = ''; status('Stopped');
  micMuted = false; hasMic = false;
  const mb = $('#micBtn'); if (mb) mb.classList.remove('off');
}

$('#go').onclick = () => run ? stop() : start();

/* ---------- WebGL: all quantizing happens on the GPU, no server round-trip ---------- */
let gl = null;
try {
  const opts = { antialias: false, alpha: false, powerPreference: 'high-performance' };
  // The shaders below are GLSL ES 1.00, so prefer a WebGL1 context.
  gl = cv.getContext('webgl', opts) || cv.getContext('webgl2', opts) || cv.getContext('experimental-webgl', opts);
} catch (e) {
  // WebGL unavailable - handled below
}
if (!gl) {
  document.querySelector('#go').disabled = true;
  alert('WebGL unavailable. Enable hardware acceleration in your browser settings (chrome://settings/system).');
  throw new Error('No WebGL');
}

// Initialize WebGL shaders and buffers with error handling
let prog;
try {
  const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uT; uniform vec2 uR,uCov; uniform vec3 uP[8];
uniform int uN,uM; uniform float uPix,uTime,uBass,uHigh,uMir;
float b2(vec2 a){a=floor(a);return fract(a.x*.5+a.y*a.y*.75);}
float b4(vec2 a){return b2(a*.5)*.25+b2(a);}
float b8(vec2 a){return b4(a*.5)*.25+b2(a);}
float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
vec3 nearest(vec3 c){
  float bd=1e9; vec3 r=uP[0];
  for(int i=0;i<8;i++){ if(i>=uN)break; vec3 d=c-uP[i]; float k=dot(d,d); if(k<bd){bd=k;r=uP[i];} }
  return r;
}
vec3 src(vec2 uv){
  uv=(uv-.5)*uCov+.5; uv.x=mix(uv.x,1.-uv.x,uMir);
  return texture2D(uT,vec2(uv.x,1.-uv.y)).rgb;
}
void main(){
  vec2 fc=gl_FragCoord.xy;
  float blk=max(1.,uPix*(1.+uBass*1.2));
  vec2 cell=floor(fc/blk);
  vec2 uv=(cell+.5)*blk/uR;
  if(uM==4) uv+=sin(uv.yx*vec2(9.,12.)+uTime*vec2(1.7,2.3))*(.004+uBass*.03);
  vec3 c=src(uv), o;
  if(uM==1){ o=nearest(c+(b8(cell)-.5)*(.28+uHigh*.3)); }
  else if(uM==2){
    float cs=max(blk,6.); vec2 g=fc/cs; vec3 cc=src((floor(g)+.5)*cs/uR);
    float r=sqrt(luma(cc))*.72+.02;
    o=mix(uP[0],nearest(cc),1.-smoothstep(r-.05,r+.05,length(fract(g)-.5)));
  }
  else if(uM==3){
    float t=clamp(luma(c),0.,1.)*float(uN-1); o=uP[0];
    for(int i=0;i<7;i++){ if(i+1>=uN)break; o=mix(o,uP[i+1],clamp(t-float(i),0.,1.)); }
  }
  else o=nearest(c);
  gl_FragColor=vec4(o,1.);
}`;
  prog = gl.createProgram();
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VS);
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
    throw new Error('Vertex shader compile error: ' + gl.getShaderInfoLog(vs));
  }
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, FS);
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    throw new Error('Fragment shader compile error: ' + gl.getShaderInfoLog(fs));
  }
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error('Program link error: ' + gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);
} catch (e) {
  console.error('[WEBGL] Initialization error:', e);
  document.querySelector('#go').disabled = true;
  alert('WebGL initialization failed: ' + e.message + '. See console for details.');
  throw e;
}

/* ---------- WebGL uniforms and setup ---------- */
const U = {};
['uT', 'uR', 'uCov', 'uN', 'uM', 'uPix', 'uTime', 'uBass', 'uHigh', 'uMir'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
U.uP = gl.getUniformLocation(prog, 'uP[0]');
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
[[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]
  .forEach(([k, v]) => gl.texParameteri(gl.TEXTURE_2D, k, v));

/* ---------- audio analysis -> palette ---------- */
let ac = null, an = null, fd = null, sr = 48000;
const band = [0, 0, 0], peak = [.1, .1, .1];   // bass / mid / high, auto-normalised per band
let cent = .4;                                   // spectral centroid (0..1, log scale)
const N = 7, cur = new Float32Array(24), tgt = new Float32Array(24);

function analyse() {
  if (!an) { for (let k = 0; k < 3; k++) band[k] *= .94; return; }
  an.getByteFrequencyData(fd);
  const hz = sr / 2 / fd.length, bin = f => Math.min(fd.length - 1, Math.round(f / hz));
  [[30, 160], [160, 2000], [2000, 9000]].forEach(([a, b], k) => {
    const i0 = bin(a), i1 = Math.max(bin(b), i0 + 1); let s = 0;
    for (let i = i0; i < i1; i++) s += fd[i];
    const raw = s / (i1 - i0) / 255;
    peak[k] = Math.max(peak[k] * .997, raw, .05);          // software AGC: reacts the same on quiet or loud mics
    const v = Math.min(1, raw / peak[k] * S.sens * (raw > .02 ? 1 : raw / .02));
    band[k] += (v - band[k]) * (v > band[k] ? .55 : .1);   // fast attack, slow release
  });
  let num = 0, den = 0;
  for (let i = 1, e = bin(8000); i < e; i++) { num += i * fd[i]; den += fd[i]; }
  if (den > 200) cent += (Math.min(1, Math.max(0, Math.log2(num / den * hz / 100) / 6)) - cent) * .06;
}
function hsl(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360; const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h * 12) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
function updatePalette(t) {
  const base = cent * 300 + t * 9, spread = 16 + band[1] * 58;
  for (let i = 0; i < N; i++) {
    const k = i / (N - 1);
    const c = hsl(base + i * spread, .55 + .4 * band[2], Math.min(.92, .05 + .84 * k + .1 * band[0] * k));
    tgt.set(c, i * 3);
  }
  for (let i = 0; i < N * 3; i++) cur[i] += (tgt[i] - cur[i]) * S.resp;
}


/* ---------- interactive dot-grid background (idle screen) ---------- */
const gc = $('#grid'), g2 = gc.getContext('2d');
const GAP = 26, R = 120, STOPS = [[0, 52, 62, 110], [.25, 47, 95, 176], [.5, 27, 154, 166], [.75, 79, 170, 90], [1, 181, 194, 48]];
const LUT = Array.from({ length: 64 }, (_, i) => {
  const v = i / 63; let k = 1; while (k < STOPS.length - 1 && STOPS[k][0] < v) k++;
  const a = STOPS[k - 1], b = STOPS[k], f = (v - a[0]) / (b[0] - a[0]);
  const c = [1, 2, 3].map(j => Math.round(a[j] + (b[j] - a[j]) * f));
  return `rgba(${c[0]},${c[1]},${c[2]},${(.3 + .7 * Math.min(1, v * 2.2)).toFixed(2)})`;
});
let gW = 0, gH = 0, gCols = 0, gRows = 0, gV = null, px = -1e4, py = -1e4, lastMove = 0, dpr = 1;
function sizeGrid() {
  dpr = Math.min(devicePixelRatio || 1, 2); gW = innerWidth; gH = innerHeight;
  gc.width = gW * dpr; gc.height = gH * dpr;
  gCols = Math.ceil(gW / GAP) + 1; gRows = Math.ceil(gH / GAP) + 1; gV = new Float32Array(gCols * gRows);
}
sizeGrid(); addEventListener('resize', sizeGrid);
addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; lastMove = performance.now(); }, { passive: true });
document.addEventListener('pointerleave', () => { px = py = -1e4; });
function drawGrid(now, aud) {
  if (now - lastMove > 2500) {            // nobody pointing: a virtual cursor wanders so it stays alive
    const t = now / 1000; px = gW * (.5 + .32 * Math.sin(t * .45)); py = gH * (.5 + .28 * Math.sin(t * .31 + 1.3));
  }
  g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.clearRect(0, 0, gW, gH);
  const ox = (gW - (gCols - 1) * GAP) / 2, oy = (gH - (gRows - 1) * GAP) / 2;
  for (let r = 0; r < gRows; r++) for (let c = 0; c < gCols; c++) {
    const x = ox + c * GAP, y = oy + r * GAP, i = r * gCols + c;
    const d2 = ((x - px) ** 2 + (y - py) ** 2) / (R * R);
    let tg = Math.exp(-d2 * 1.6);
    if (aud) {                              // overlay mode: bass ring + mid swell + treble sparkle
      const dc = Math.hypot(x - gW / 2, y - gH / 2), ring = (now * .24) % (Math.hypot(gW, gH) / 2 + 80);
      tg = Math.max(tg, band[0] * Math.exp(-(((dc - ring) / 55) ** 2)) * .95,
        band[1] * .3 * (.5 + .5 * Math.sin(x * .017 + y * .013 + now * .0021)),
        band[2] * ((Math.sin(c * 12.9898 + r * 78.233 + (now * .006 | 0)) * 43758.5453 % 1 + 1) % 1 > .93 ? .8 : 0));
    }
    gV[i] += (tg - gV[i]) * (tg > gV[i] ? .3 : .045);          // quick grow, slow fade = trail
    const v = gV[i], s = 2 + 12 * Math.pow(v, 1.15);
    g2.fillStyle = LUT[Math.min(63, v * 63 | 0)];
    g2.beginPath();
    if (g2.roundRect) g2.roundRect(x - s / 2, y - s / 2, s, s, Math.min(2.5, s / 4)); else g2.rect(x - s / 2, y - s / 2, s, s);
    g2.fill();
  }
}

/* ---------- render loop ---------- */
const sw = $('#sw'); for (let i = 0; i < N; i++) sw.appendChild(document.createElement('span'));
let t0 = performance.now(), fN = 0, fT = t0, tick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!run) { drawGrid(now, false); return; }
  const w = innerWidth, h = innerHeight;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
  if (vid.readyState >= 2 && vid.videoWidth) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, vid);
  } else return;
  const t = (now - t0) / 1000;
  analyse(); updatePalette(t);
  const ca = w / h, va = vid.videoWidth / vid.videoHeight;
  gl.uniform1i(U.uT, 0);
  gl.uniform2f(U.uR, w, h);
  gl.uniform2f(U.uCov, ca > va ? 1 : ca / va, ca > va ? va / ca : 1);
  gl.uniform3fv(U.uP, cur.length === 24 ? cur : new Float32Array(24));
  gl.uniform1i(U.uN, N); gl.uniform1i(U.uM, mode);
  gl.uniform1f(U.uPix, S.pix); gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uBass, band[0]); gl.uniform1f(U.uHigh, band[2]); gl.uniform1f(U.uMir, mirror);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  document.documentElement.style.setProperty('--lvl', ((band[0] + band[1] + band[2]) / 3).toFixed(3));
  if (!(tick++ & 1)) for (let i = 0; i < N; i++)
    sw.children[i].style.background = `rgb(${cur[i * 3] * 255 | 0},${cur[i * 3 + 1] * 255 | 0},${cur[i * 3 + 2] * 255 | 0})`;
  if (ov) drawGrid(now, true);
  fN++;
  if (now - fT > 500) { $('#fps').textContent = Math.round(fN * 1000 / (now - fT)) + ' fps'; fN = 0; fT = now; }
}
requestAnimationFrame(frame);

/* ---------- UI ---------- */
const seg = $('#seg'), hl = seg.firstElementChild;
MODES.forEach((m, i) => { const b = document.createElement('button'); b.textContent = m; b.onclick = () => setMode(i); seg.appendChild(b); });
function moveHl() { const b = seg.children[mode + 1]; hl.style.width = b.offsetWidth + 'px'; hl.style.transform = `translateX(${b.offsetLeft}px)`; }
function setMode(i) {
  mode = i; [...seg.children].forEach((b, k) => b.classList.toggle('on', k === i + 1));
  const p = PRESETS[mode];
  S = p;
  const sPix = document.getElementById('sPix'), sSens = document.getElementById('sSens'), sResp = document.getElementById('sResp');
  sPix.value = p.pix; sSens.value = p.sens; sResp.value = p.resp;
  [sPix, sSens, sResp].forEach(el => { el.dispatchEvent(new Event('input')); });
  moveHl(); seg.children[i + 1].scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
}
setMode(0); addEventListener('resize', moveHl); document.fonts && document.fonts.ready.then(moveHl);

const fmt = { sPix: v => v + 'px', sSens: v => (+v).toFixed(1) + '×', sResp: v => Math.round(v * 100) + '%' };
[['sPix', 'pix'], ['sSens', 'sens'], ['sResp', 'resp']].forEach(([id, key]) => {
  const el = $('#' + id), out = el.parentElement.querySelector('output');
  const sync = () => { S[key] = +el.value; PRESETS[mode][key] = S[key]; out.textContent = fmt[id](el.value); el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%'); };
  el.addEventListener('input', sync); sync();
});

const tune = $('#tune'), tb = $('#tb');
tb.onclick = e => { e.stopPropagation(); tune.classList.toggle('open'); tb.classList.toggle('on'); toggleDevices(false); };
document.addEventListener('pointerdown', e => { if (!tune.contains(e.target) && !tb.contains(e.target)) { tune.classList.remove('open'); tb.classList.remove('on'); } });

/* ---------- camera / microphone ---------- */
const devicesPanel = $('#devices'), camBtn = $('#camBtn'), micBtn = $('#micBtn');
const camSelect = $('#camSelect'), micSelect = $('#micSelect'), devNote = $('#devNote');

async function refreshDevices() {
  const md = navigator.mediaDevices;
  if (!md || !md.enumerateDevices) { devNote.textContent = 'Device selection needs https or localhost.'; return; }
  let list;
  try { list = await md.enumerateDevices(); } catch (e) { return; }
  const fill = (sel, items, empty, key) => {
    const prev = selected[key];
    sel.innerHTML = '';
    if (!items.length) {
      const o = document.createElement('option'); o.value = ''; o.textContent = empty; sel.appendChild(o);
      return;
    }
    items.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || ('Device ' + (i + 1));
      sel.appendChild(o);
    });
    if (prev && items.some(d => d.deviceId === prev)) sel.value = prev;
    else selected[key] = sel.value;
  };
  fill(camSelect, list.filter(d => d.kind === 'videoinput'), 'No camera found', 'video');
  fill(micSelect, list.filter(d => d.kind === 'audioinput'), 'No microphone found', 'audio');
  devNote.textContent = list.some(d => !d.label) ? 'Device names appear after you allow access.' : '';
}

function toggleDevices(force) {
  const open = force === undefined ? !devicesPanel.classList.contains('open') : force;
  devicesPanel.classList.toggle('open', open);
  camBtn.classList.toggle('on', open);
  if (open) {
    tune.classList.remove('open'); tb.classList.remove('on');
    refreshDevices(); wake();
  }
}
camBtn.onclick = e => { e.stopPropagation(); toggleDevices(); };
document.addEventListener('pointerdown', e => {
  if (devicesPanel.classList.contains('open') && !devicesPanel.contains(e.target) && !camBtn.contains(e.target)) toggleDevices(false);
});

async function switchStream() {
  if (!run) return;
  const muted = micMuted;
  stop();
  await start();
  if (muted && run && hasMic) toggleMic();
}
camSelect.onchange = () => { selected.video = camSelect.value; if (run) switchStream(); };
micSelect.onchange = () => { selected.audio = micSelect.value; if (run) switchStream(); };
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener?.('devicechange', refreshDevices);

function toggleMic() {
  if (!hasMic || !stream || !stream.getAudioTracks().length) {
    status(run ? 'No microphone available' : 'Start the feed to use the mic');
    return;
  }
  micMuted = !micMuted;
  stream.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
  micBtn.classList.toggle('off', micMuted);
  micBtn.title = micMuted ? 'Microphone (muted)' : 'Microphone (mute)';
  status(micMuted ? 'Mic muted' : 'Live');
}
micBtn.onclick = e => { e.stopPropagation(); toggleMic(); };
function toggleMirror() { mirror ^= 1; $('#mr').classList.toggle('on', !!mirror); }
function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
function toggleGrid() { ov = !ov; body.classList.toggle('ov', ov); $('#gd').classList.toggle('on', ov); }
$('#gd').onclick = toggleGrid; $('#mr').onclick = toggleMirror; $('#fs').onclick = toggleFs;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey) return;
  if (e.key >= '1' && e.key <= '5') setMode(+e.key - 1);
  else if (e.key === ' ') { e.preventDefault(); $('#go').click(); }
  else if (e.key === 'f') toggleFs(); else if (e.key === 'm') toggleMirror(); else if (e.key === 'g') toggleGrid();
});

const presetName = document.getElementById('presetName');
const presetList = document.getElementById('presetList');
const presetSave = document.getElementById('presetSave');
const presetLoad = document.getElementById('presetLoad');
function refreshPresets() {
  const list = JSON.parse(localStorage.getItem('lfq_presets') || '[]');
  presetList.innerHTML = '';
  list.forEach(p => { const o = document.createElement('option'); o.value = p.name; o.textContent = p.name; presetList.appendChild(o); });
}
presetSave.onclick = () => {
  const name = presetName.value.trim(); if (!name) return;
  const list = JSON.parse(localStorage.getItem('lfq_presets') || '[]');
  const entry = { name, mode, pix: S.pix, sens: S.sens, resp: S.resp };
  const idx = list.findIndex(p => p.name === name); if (idx >= 0) list[idx] = entry; else list.push(entry);
  localStorage.setItem('lfq_presets', JSON.stringify(list)); refreshPresets();
};
presetLoad.onclick = () => {
  const name = presetList.value; if (!name) return;
  const list = JSON.parse(localStorage.getItem('lfq_presets') || '[]');
  const p = list.find(x => x.name === name); if (!p) return;
  setMode(p.mode);
  const sPix = document.getElementById('sPix'), sSens = document.getElementById('sSens'), sResp = document.getElementById('sResp');
  sPix.value = p.pix; sSens.value = p.sens; sResp.value = p.resp;
  [sPix, sSens, sResp].forEach(el => el.dispatchEvent(new Event('input')));
};
refreshPresets();
let hideT;
function wake() {
  body.classList.remove('idle'); clearTimeout(hideT);
  hideT = setTimeout(() => { if (run && !$('#dock').matches(':hover') && !tune.classList.contains('open') && !integrationsOpen) body.classList.add('idle'); }, 3000);
}
['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* ---------- integrations panel ---------- */
let integrationsOpen = false;
const integrationPanel = $('#integrations-panel');
const closeIntegrations = $('#close-integrations');
const integrationTabs = $('#integration-tabs');
const integrationContent = $('#integration-tab-content');

function toggleIntegrations(force) {
  integrationsOpen = force === undefined ? !integrationsOpen : force;
  integrationPanel.style.opacity = integrationsOpen ? '1' : '0';
  integrationPanel.style.transform = integrationsOpen ? 'translateY(0) scale(1)' : 'translateY(10px) scale(.94)';
  integrationPanel.style.pointerEvents = integrationsOpen ? 'auto' : 'none';
  $('#integration').classList.toggle('on', integrationsOpen);
  if (integrationsOpen) wake();
}
$('#integration').onclick = e => { e.stopPropagation(); toggleIntegrations(); };
closeIntegrations.onclick = () => toggleIntegrations(false);
document.addEventListener('pointerdown', e => {
  if (integrationsOpen && !integrationPanel.contains(e.target) && !$('#integration').contains(e.target)) toggleIntegrations(false);
});

/* These integrations need a backend that doesn't exist yet, so the buttons
   report that instead of throwing a ReferenceError. */
const tabContent = {
  local: `
    <div style="margin-top:12px;">
      <h4>Local Network (Tuya/IoT)</h4>
      <p>Discover Tuya devices on your local network</p>
      <button id="scan-tuya" style="width:100%;margin-top:8px;">Scan for Devices</button>
      <div id="tuya-devices" style="margin-top:12px;max-height:200px;overflow:auto;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px;display:none;"></div>
    </div>
  `,
  wifi: `
    <div style="margin-top:12px;">
      <h4>WiFi Devices</h4>
      <p>Connect to WiFi-enabled equipment</p>
      <input id="wifi-ssid" type="text" placeholder="SSID" style="width:100%;padding:8px;margin:8px 0;border:1px solid rgba(255,255,255,.18);border-radius:4px;">
      <input id="wifi-password" type="password" placeholder="Password" style="width:100%;padding:8px;margin:8px 0;border:1px solid rgba(255,255,255,.18);border-radius:4px;">
      <button id="connect-wifi" style="width:100%;margin-top:8px;">Connect</button>
    </div>
  `,
  google: `
    <div style="margin-top:12px;">
      <h4>Google Home</h4>
      <p>Connect to Google Home/Nest devices</p>
      <button id="scan-google" style="width:100%;margin-top:8px;">Scan for Devices</button>
      <div id="google-devices" style="margin-top:12px;max-height:200px;overflow:auto;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px;display:none;"></div>
    </div>
  `,
  other: `
    <div style="margin-top:12px;">
      <h4>Other Providers</h4>
      <p>Add integrations with other smart home providers</p>
      <input id="other-provider" type="text" placeholder="Provider name" style="width:100%;padding:8px;margin:8px 0;border:1px solid rgba(255,255,255,.18);border-radius:4px;">
      <button id="add-provider" style="width:100%;margin-top:8px;">Add Provider</button>
    </div>
  `
};

function renderTabContent(tab) {
  integrationContent.innerHTML = tabContent[tab] || '';
  [...integrationTabs.children].forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const stub = label => () => {
    const p = document.createElement('p');
    p.style.cssText = 'margin-top:10px;color:var(--mut)';
    p.textContent = label + ' is not available yet.';
    integrationContent.appendChild(p);
  };
  const wire = (id, label) => { const el = document.getElementById(id); if (el) el.onclick = stub(label); };
  wire('scan-tuya', 'Tuya discovery');
  wire('connect-wifi', 'WiFi connect');
  wire('scan-google', 'Google Home discovery');
  wire('add-provider', 'Custom providers');
}
function switchTab(tab) { renderTabContent(tab); }

['local', 'wifi', 'google', 'other'].forEach(tab => {
  const b = document.createElement('button');
  b.textContent = tab[0].toUpperCase() + tab.slice(1);
  b.dataset.tab = tab;
  b.onclick = () => switchTab(tab);
  integrationTabs.appendChild(b);
});
renderTabContent('local');
</script>
</body>
