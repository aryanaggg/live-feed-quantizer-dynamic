<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Feed Quantizer</title>
  <style>
    :root { --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); --text: #f2f2f2; --muted: #8a8a8a; --err: #ff6b6b; --ok: #5ee3a1; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
    body { animation: fade .8s ease backwards; }
    body.idle { cursor: none; }
    @keyframes fade { from { opacity: 0; } }
    button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* output fills the viewport */
    #processedWrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #processed { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .6s var(--ease); image-rendering: pixelated; }
    #processed:not([src]) { opacity: 0; }
    .empty { position: absolute; font-size: 14px; color: var(--muted); animation: pulse 3.2s ease-in-out infinite; }
    body.on .empty { opacity: 0; animation: none; }
    @keyframes pulse { 50% { opacity: .4; } }

    /* camera preview: free-floating, drag anywhere, minimize to a side tab */
    .pip { position: fixed; z-index: 4; width: clamp(200px, 24vw, 300px); aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #0a0a0a; cursor: grab; touch-action: none; user-select: none;
      box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.6);
      transition: left .55s var(--spring), top .55s var(--spring), scale .35s var(--spring), box-shadow .3s; }
    .pip.dragging { cursor: grabbing; scale: 1.03; box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 28px 60px rgba(0,0,0,.7); }
    .pip video { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .pip-off { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--muted); }
    body.on .pip-off { opacity: 0; }
    .pip-min { position: absolute; z-index: 2; top: 8px; right: 8px; width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer; color: #fff; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .25s, background .2s; }
    .pip-min:hover { background: rgba(0,0,0,.8); }
    .pip:hover .pip-min, .pip-min:focus-visible { opacity: 1; }
    @media (hover: none) { .pip-min { opacity: 1; } }
    .pip-min svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
    .pip[data-half=l] .pip-min { right: auto; left: 8px; }
    .pip[data-half=l] .pip-min svg { transform: rotate(180deg); }
    .pip.min { cursor: pointer; }
    .pip.min .pip-min { display: none; }
    .pip.min::before { content: ''; position: absolute; inset: 0; z-index: 2; background: rgba(0,0,0,.55); }
    .pip.min::after { content: ''; position: absolute; z-index: 3; top: 50%; width: 9px; height: 9px; border: 0 solid #fff; }
    .pip.min[data-side=r]::after { left: 15px; border-width: 0 0 2px 2px; transform: translateY(-50%) rotate(45deg); }
    .pip.min[data-side=l]::after { right: 15px; border-width: 2px 2px 0 0; transform: translateY(-50%) rotate(45deg); }
    .camList { position: absolute; inset: 0; display:flex; flex-direction:column; gap:6px; padding:10px; overflow: auto; z-index: 3; }
    .camListItem { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.08); color:#fff; font-size:12px; cursor:pointer; }
    .camListItem.active { background:rgba(94,227,161,.25); }
    .camListItem small { color:var(--muted); }
    .camListActions { display:flex; gap:6px; }
    .camListBtn { border:0; background:transparent; color:var(--muted); font-size:11px; cursor:pointer; }
    .camListBtn:hover { color:#fff; }

    /* level: one thin bar on the left edge */
    .meter { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; background: rgba(0,0,0,.4); border-radius: 8px; backdrop-filter: blur(6px); }
    #audioMeter { display: block; width: 4px; border-radius: 2px; }
    #meterText { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }

    /* chrome fades away while running */
    .chrome { transition: opacity .5s var(--ease), transform .6s var(--ease); }
    body.idle .chrome { opacity: 0; }
    body.idle:has(.status-error) .chrome { opacity: 1; }

    header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px 40px; background: linear-gradient(rgba(0,0,0,.6), transparent); pointer-events: none; }
    h1 { font-size: 13px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
    #status { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12.5px; }
    #status::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .4s; }
    #statusText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #statsText { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #statsText:empty { display: none; }
    .status-ok::before { background: var(--ok); animation: ping 1.8s ease-out infinite; }
    .status-error::before { background: var(--err); }
    .status-error #statusText { color: var(--err); }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(94,227,161,.6); } 100% { box-shadow: 0 0 0 9px rgba(94,227,161,0); } }

    /* controls */
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; align-items: center; gap: clamp(10px, 3vw, 22px); flex-wrap: wrap; padding: 56px 16px 26px; background: linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events: none; }
    #dock > .icon, #dock > .rec { pointer-events: auto; }
    .icon { width: clamp(40px, 8vw, 46px); height: clamp(40px, 8vw, 46px); display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer; color: #fff; background: rgba(255,255,255,.12); transition: background .2s, color .2s, transform .35s var(--spring); }
    .icon:hover { background: rgba(255,255,255,.22); }
    .icon:active { transform: scale(.88); }
    .icon.on { background: #fff; color: #000; }
    .icon svg { width: clamp(18px, 4vw, 20px); height: clamp(18px, 4vw, 20px); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.is-fs .enter, .icon:not(.is-fs) .exit { display: none; }

    .rec { display: grid; }
    .rec button { grid-area: 1 / 1; width: 66px; height: 66px; display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer; transition: transform .5s var(--spring), opacity .3s, background .2s; }
    .rec button::before { content: ''; transition: background .2s; }
    .rec button:hover:not(:disabled) { transform: scale(1.07); }
    .rec button:active:not(:disabled) { transform: scale(.94); }
    .rec button:disabled { transform: scale(.4) rotate(-90deg); opacity: 0; pointer-events: none; }
    #startBtn { background: #fff; }
    #startBtn::before { width: 22px; height: 24px; margin-left: 5px; background: #000; clip-path: polygon(0 0, 100% 50%, 0 100%); }
    #stopBtn { background: transparent; box-shadow: inset 0 0 0 2.5px #fff; }
    #stopBtn::before { width: 22px; height: 22px; border-radius: 5px; background: #fff; }
    #stopBtn:hover:not(:disabled)::before { background: var(--err); }

    .panel { position: absolute; left: 50%; bottom: 112px; width: min(320px, 90vw); max-height: 60vh; overflow-y: auto; display: grid; gap: 14px; padding: clamp(12px, 3vw, 16px) clamp(14px, 4vw, 18px); background: #121212; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.6);
      opacity: 0; transform: translate(-50%, 10px) scale(.94); transform-origin: 50% 100%; pointer-events: none; transition: opacity .25s, transform .5s var(--spring); }
    .panel.open { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
    .row { display: grid; grid-template-columns: minmax(48px, 56px) 1fr auto; align-items: center; gap: 10px; }
    label { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    .camTabs { display:flex; flex-wrap: wrap; gap:4px; width:100%; background:rgba(255,255,255,.06); border-radius:8px; overflow:hidden; }
    .camTab { flex:1 1 60px; border:0; background:transparent; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; text-transform:uppercase; letter-spacing:.04em; transition:all .2s; padding:6px 4px; text-align:center; }
    .camTab:hover { color:#fff; background:rgba(255,255,255,.1); }
    .camTab.camTabActive { color:#fff; background:rgba(255,255,255,.18); }
    .camRow { display:grid; grid-template-columns: minmax(48px, 56px) 1fr auto; align-items: center; gap: 10px; flex-wrap: wrap; }
    .camRow input { min-width: 0; height: 28px; border: 0; border-radius: 6px; background: rgba(255,255,255,.08); color: #fff; font-size: 12px; padding: 0 10px; box-sizing: border-box; width: 100%; }
    .camRow input::placeholder { color: var(--muted); }
    .camRow button { height: 28px; border: 0; border-radius: 6px; background: rgba(255,255,255,.12); color: #fff; font-size: 12px; cursor: pointer; transition: background .2s; white-space: nowrap; padding: 0 12px; }
    .camRow button:hover { background: rgba(255,255,255,.22); }
    .camRow button:active { transform: scale(.96); }
    .val { text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; cursor: pointer; background: linear-gradient(90deg, #fff var(--p, 50%), rgba(255,255,255,.16) var(--p, 50%)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 0; transition: transform .25s var(--ease); }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 0; transition: transform .25s var(--ease); }
    input[type=range]::-moz-range-track { background: transparent; }
    input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { transform: scale(1.3); }
    input[type=range]:hover::-moz-range-thumb, input[type=range]:active::-moz-range-thumb { transform: scale(1.3); }

    @media (max-width: 700px) { #statsText { display: none; } .pip { width: 30vw; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition-duration: .01ms !important; } }
    body.ip-cam #pip, body.rtsp-cam #pip, body.onvif-cam #pip { display: block; }
  </style>
</head>
<body>
  <section id="processedWrap">
    <span class="empty">Press start to begin</span>
    <img id="processed" alt="Processed output" />
  </section>

  <div class="pip" id="pip">
    <span class="pip-off">Camera off</span>
    <video id="video" autoplay playsinline muted></video>
    <div id="camList" class="camList"></div>
    <button class="pip-min" id="pipMin" title="Minimize" aria-label="Minimize camera"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <aside class="meter">
    <canvas id="audioMeter" width="4" height="240"></canvas>
    <div id="meterText">—</div>
  </aside>

  <header class="chrome">
    <h1>Live Feed Quantizer</h1>
    <div id="status">
      <span id="statusText">Ready. Click Start to begin.</span>
      <small id="statsText"></small>
    </div>
  </header>

  <div id="dock" class="chrome">
    <button class="icon" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    <button class="icon" id="flipBtn" title="Flip" aria-label="Flip">
      <svg viewBox="0 0 24 24"><path d="M16 16l3-3-3-3M8 8l-3 3 3 3M16 3v13M8 21V8"/></svg>
    </button>
    <div class="rec">
      <button id="startBtn" title="Start" aria-label="Start"></button>
      <button id="stopBtn" title="Stop" aria-label="Stop" disabled></button>
    </div>
    <button class="icon" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
      <svg class="enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <button class="icon" id="cameraBtn" title="Camera" aria-label="Camera">
      <svg viewBox="0 0 24 24"><path d="M2 7v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2zm20-2h-2.2l-1.4-1.4C19.4 2.6 18.5 2 17.5 2h-11c-1 0-1.9.6-2.2 1.5l-1.4 1.4H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2m-5 14c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>
    </button>
    <div class="panel" id="panel">
      <div class="row"><label for="qualityRange">Quality</label><input id="qualityRange" type="range" min="10" max="100" value="40" step="1" /><span id="qualityVal" class="val">40</span></div>
      <div class="row"><label for="gainRange">Gain</label><input id="gainRange" type="range" min="0.1" max="5" value="1" step="0.1" /><span id="gainVal" class="val">1.0x</span></div>
    </div>
    <div class="panel" id="cameraPanel">
      <div class="row"><label>Source</label>
        <div id="camSourceTabs" class="camTabs">
          <button id="camLocalBtn" class="camTab camTabActive" data-source="local">Local</button>
          <button id="camIpBtn" class="camTab" data-source="ip">IP</button>
          <button id="camOnvifBtn" class="camTab" data-source="onvif">ONVIF</button>
          <button id="camRtspBtn" class="camTab" data-source="rtsp">RTSP</button>
        </div>
      </div>
      <div class="camRow" id="camIpRow" style="display:none;"><label>URL</label><input id="camIpUrl" type="url" placeholder="http://cam.local/snapshot.jpg" /><button id="camConnectBtn">Connect</button></div>
      <div class="camRow" id="camOnvifRow" style="display:none;">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <label>Device</label>
          <input id="camOnvifHost" type="text" placeholder="192.168.1.100" />
          <div style="display:flex;gap:8px;">
            <input id="camOnvifPort" type="text" placeholder="80" style="flex:0 0 60px;" />
            <input id="camOnvifUser" type="text" placeholder="user" style="flex:1;" />
            <input id="camOnvifPass" type="password" placeholder="pass" style="flex:1;" />
          </div>
          <button id="camOnvifConnectBtn">Connect</button>
        </div>
      </div>
      <div class="camRow" id="camRtspRow" style="display:none;"><label>URL</label><input id="camRtspUrl" type="url" placeholder="rtsp://192.168.1.100:554/stream" /><button id="camRtspConnectBtn">Connect</button></div>
    </div>
  </div>

  <script>
    // ================= element refs =================
    const video = document.getElementById('video');
    const processed = document.getElementById('processed');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const statusDiv = document.getElementById('status');
    const statsText = document.getElementById('statsText');
    const audioMeter = document.getElementById('audioMeter');
    const meterText = document.getElementById('meterText');
    const qualityRange = document.getElementById('qualityRange');
    const qualityVal = document.getElementById('qualityVal');
    const gainRange = document.getElementById('gainRange');
    const gainVal = document.getElementById('gainVal');
    const camListEl = document.getElementById('camList');
    let savedCams = JSON.parse(localStorage.getItem('savedCams') || '[]');
    let activeCamId = localStorage.getItem('activeCamId');
    function saveCams(){ localStorage.setItem('savedCams', JSON.stringify(savedCams)); if(activeCamId) localStorage.setItem('activeCamId', activeCamId); }
    function renderCamList(){
      camListEl.innerHTML='';
      if(savedCams.length===0){
        const empty=document.createElement('div'); empty.textContent='No saved cameras'; empty.style.color='var(--muted)'; empty.style.fontSize='12px'; camListEl.appendChild(empty); return;
      }
      savedCams.forEach(cam=>{
        const item=document.createElement('div'); item.className='camListItem'+(cam.id===activeCamId?' active':'');
        const info=document.createElement('div'); info.innerHTML='<div>'+cam.name+'</div><small>'+cam.source.toUpperCase()+'</small>';
        const actions=document.createElement('div'); actions.className='camListActions';
        const connect=document.createElement('button'); connect.className='camListBtn'; connect.textContent='Connect'; connect.onclick=(e)=>{e.stopPropagation(); connectSavedCam(cam);};
        const remove=document.createElement('button'); remove.className='camListBtn'; remove.textContent='Remove'; remove.onclick=(e)=>{e.stopPropagation(); savedCams=savedCams.filter(c=>c.id!==cam.id); if(activeCamId===cam.id) activeCamId=null; saveCams(); renderCamList();};
        actions.append(connect,remove);
        item.append(info,actions);
        camListEl.appendChild(item);
      });
    }
    function connectSavedCam(cam){
      camSource=cam.source; activeCamId=cam.id; saveCams(); renderCamList();
      if(!ws || ws.readyState!==WebSocket.OPEN) return;
      if(cam.source==='local'){ ws.send(JSON.stringify({type:'camera_source',source:'local'})); }
      else { ws.send(JSON.stringify({type:'camera_source',source:cam.source,url:cam.url})); }
      setCamPanel(false);
    }
    function addSavedCam(name,source,url){
      const id=Date.now().toString();
      savedCams.push({id,name,source,url}); activeCamId=id; saveCams(); renderCamList(); connectSavedCam({id,name,source,url});
    }
    renderCamList();
    const flipBtn = document.getElementById('flipBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const cameraPanel = document.getElementById('cameraPanel');
    const camLocalBtn = document.getElementById('camLocalBtn');
    const camIpBtn = document.getElementById('camIpBtn');
    const camIpRow = document.getElementById('camIpRow');
    const camIpUrl = document.getElementById('camIpUrl');
    const camConnectBtn = document.getElementById('camConnectBtn');
    const camOnvifBtn = document.getElementById('camOnvifBtn');
    const camOnvifRow = document.getElementById('camOnvifRow');
    const camOnvifHost = document.getElementById('camOnvifHost');
    const camOnvifPort = document.getElementById('camOnvifPort');
    const camOnvifUser = document.getElementById('camOnvifUser');
    const camOnvifPass = document.getElementById('camOnvifPass');
    const camOnvifConnectBtn = document.getElementById('camOnvifConnectBtn');
    const camRtspBtn = document.getElementById('camRtspBtn');
    const camRtspRow = document.getElementById('camRtspRow');
    const camRtspUrl = document.getElementById('camRtspUrl');
    const camRtspConnectBtn = document.getElementById('camRtspConnectBtn');

    // ================= backend resolution =================
    // Same origin by default; falls back to http://localhost:8000 when served
    // by a dev server. Override with ?backend=localhost:9000
    let backendBase = '';

    function backendHost() {
      return backendBase ? backendBase.replace(/^https?:\/\//, '').replace(/\/+$/, '') : window.location.host;
    }

    async function healthOk(base) {
      try {
        const res = await fetch(base + '/health', { signal: AbortSignal.timeout(1000) });
        if (!res.ok) return false;
        const obj = await res.json().catch(() => ({}));
        return obj.status === 'ok';
      } catch (err) {
        return false;
      }
    }

    async function resolveBackend() {
      const explicit = new URLSearchParams(window.location.search).get('backend');
      if (explicit) {
        backendBase = explicit.trim().replace(/\/+$/, '');
        console.log('[BACKEND] Using explicit backend:', backendBase);
        return;
      }
      if (await healthOk('')) { backendBase = ''; return; }
      if (await healthOk('http://localhost:8000')) {
        backendBase = 'http://localhost:8000';
        console.log('[BACKEND] Using dev backend at', backendBase);
        return;
      }
      backendBase = '';
    }

    // ================= state =================
    let stream = null;
    let ws = null;
    let running = false;
    let audioContext = null;
    let mediaSource = null;
    let audioWorkletNode = null;
    let scriptNode = null;
    let captureCanvas = null;
    let captureCtx = null;
    let captureTimer = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;

    let frameCount = 0;
    let responseCount = 0;
    let droppedFrames = 0;
    let pendingFrames = 0;
    const MAX_PENDING = 2;

    let clientSendQuality = parseInt(qualityRange.value, 10) / 100.0;
    let serverEncodeQuality = parseInt(qualityRange.value, 10);
    let audioGain = parseFloat(gainRange.value);

    let meterLevelDb = -100;
    let meterPeakDb = -100;
    let meterAnimationFrame = null;

    let processedSrcUrl = null;

    // ================= UI helpers =================
    function updateStatus(msg, isError = false) {
      statusText.textContent = msg;
      statusDiv.classList.toggle('status-error', isError);
      statusDiv.classList.toggle('status-ok', !isError && msg.indexOf('Processing') === 0);
      console.log('[STATUS]', msg);
    }

    function updateStats() {
      statsText.textContent = (frameCount || responseCount)
        ? `${frameCount} sent · ${responseCount} received` + (droppedFrames ? ` · ${droppedFrames} dropped` : '')
        : '';
    }

    function updateMeterText() {
      if (!meterText) return;
      meterText.textContent = meterLevelDb <= -100 ? '—' : `${Math.round(meterLevelDb)} dB`;
    }

    // ================= sliders =================
    function sendControl(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify(payload));
          return true;
        } catch (err) {
          console.error('[WS] Failed to send control message:', err);
        }
      }
      return false;
    }

    let flipMode = 'none';
    flipBtn.addEventListener('click', () => {
      const modes = ['none', 'horizontal', 'vertical', 'both'];
      flipMode = modes[(modes.indexOf(flipMode) + 1) % modes.length];
      flipBtn.classList.toggle('on', flipMode !== 'none');
      sendControl({ type: 'flip', mode: flipMode });
    });

    qualityRange.addEventListener('input', (e) => {
      const v = parseInt(e.target.value, 10);
      qualityVal.textContent = v;
      clientSendQuality = v / 100.0;
      serverEncodeQuality = v;
      sendControl({ type: 'jpeg_quality', value: serverEncodeQuality });
    });

    gainRange.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      audioGain = v;
      gainVal.textContent = v.toFixed(1) + 'x';
      sendControl({ type: 'audio_gain', value: audioGain });
    });

    // ================= fullscreen =================
    function updateFullscreenButton() {
      const isFs = !!document.fullscreenElement;
      fullscreenBtn.classList.toggle('is-fs', isFs);
      fullscreenBtn.title = isFs ? 'Exit fullscreen' : 'Fullscreen';
    }

    fullscreenBtn.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (err) {
        console.error('[FS] Fullscreen toggle failed:', err);
      }
      updateFullscreenButton();
    });
    document.addEventListener('fullscreenchange', updateFullscreenButton);

    // ================= audio meter =================
    let dispLevel = 0, dispPeak = 0;
    function drawAudioMeter() {
      const ctx = audioMeter.getContext('2d');
      const w = audioMeter.width, h = audioMeter.height;
      const norm = (db) => Math.max(0, Math.min(1, ((Number.isFinite(db) ? db : -100) + 60) / 60));
      const t = norm(meterLevelDb), p = norm(meterPeakDb);
      dispLevel += (t - dispLevel) * (t > dispLevel ? 0.35 : 0.08);   // fast attack, slow release
      dispPeak += (p - dispPeak) * 0.12;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, 0, w, h, w / 2); else ctx.rect(0, 0, w, h);
      ctx.fill();

      const g = ctx.createLinearGradient(0, h, 0, 0);
      g.addColorStop(0, '#5ee3a1'); g.addColorStop(0.7, '#fff'); g.addColorStop(0.95, '#ff6b6b');
      const fh = Math.max(w, dispLevel * h);
      ctx.fillStyle = g;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(0, h - fh, w, fh, w / 2); else ctx.rect(0, h - fh, w, fh);
      ctx.fill();

      if (dispPeak > 0.03) {
        ctx.fillStyle = 'rgba(94,227,161,0.8)';
        ctx.fillRect(0, Math.max(0, h - dispPeak * h - 1), w, 1);
      }
      meterAnimationFrame = window.requestAnimationFrame(drawAudioMeter);
    }

    // ================= websocket =================
    function notifyServerSettings() {
      sendControl({ type: 'audio_info', sampleRate: (audioContext && audioContext.sampleRate) ? audioContext.sampleRate : 44100 });
      sendControl({ type: 'jpeg_quality', value: serverEncodeQuality });
      sendControl({ type: 'audio_gain', value: audioGain });
    }

    function connectWs() {
      if (!running) return;
      updateStatus('Connecting to server...');
      const isHttpsBackend = (backendBase || window.location.protocol).indexOf('https') === 0;
      const protocol = isHttpsBackend ? 'wss:' : 'ws:';
      const host = backendHost();
      let socket;
      try {
        socket = new WebSocket(`${protocol}//${host}/ws`);
      } catch (err) {
        console.error('[WS] Failed to create WebSocket:', err);
        scheduleReconnect();
        return;
      }
      ws = socket;
      socket.binaryType = 'arraybuffer';

      socket.onopen = () => {
        reconnectAttempts = 0;
        updateStatus('Processing');
        notifyServerSettings();
        if(activeCamId){
          const cam=savedCams.find(c=>c.id===activeCamId); if(cam) connectSavedCam(cam);
        }
      };

      socket.onmessage = (evt) => {
        pendingFrames = Math.max(0, pendingFrames - 1);
        responseCount++;
        const data = evt.data;

        if (!data || data.length === 0) {
          console.warn('[WS] Empty response from server');
          return;
        }

        if (data[0] === '{' || data[0] === '"') {
          try {
            const obj = JSON.parse(data);
            if (obj.type === 'status' && obj.detail === 'waiting_for_mic') {
              updateStatus('Waiting for microphone audio…', true);
            } else if (obj.type === 'status' && obj.detail === 'camera_connected') {
            updateStatus('Camera connected');
            document.body.classList.add('network-cam');
            if (camSource === 'ip') {
              document.body.classList.add('ip-cam');
            } else if (camSource === 'rtsp') {
              document.body.classList.add('rtsp-cam');
            } else if (camSource === 'onvif') {
              document.body.classList.add('onvif-cam');
            }
            } else if (obj.type === 'error') {
              const detail = obj.detail === 'invalid_frame' ? 'A frame failed to decode on the server.'
                : obj.detail === 'processing_failed' ? 'A frame failed to process on the server.'
                : (obj.detail || 'Server error.');
              console.warn('[WS] Server error:', detail);
            }
          } catch (err) {
            console.warn('[WS] Unknown JSON message:', err);
          }
          updateStats();
          return;
        }

        if (data instanceof ArrayBuffer) {
          if (processedSrcUrl) URL.revokeObjectURL(processedSrcUrl);
          const blob = new Blob([data], { type: 'image/jpeg' });
          processedSrcUrl = URL.createObjectURL(blob);
          processed.src = processedSrcUrl;
          if (responseCount % 5 === 0) {
            updateStatus('Processing');
            updateStats();
          }
          return;
        }

        processed.src = data;
        if (responseCount % 5 === 0) {
          updateStatus('Processing');
          updateStats();
        }
      };

      socket.onclose = () => {
        if (ws !== socket) return;
        ws = null;
        if (!running) return;
        scheduleReconnect();
      };

      socket.onerror = (e) => {
        console.error('[WS] Error:', e);
      };
    }

    function scheduleReconnect() {
      const delay = Math.min(5000, 500 * Math.pow(2, reconnectAttempts++));
      updateStatus(`Connection lost - retrying in ${Math.round(delay / 1000)}s (attempt ${reconnectAttempts})`, true);
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        if (running) connectWs();
      else {
        if(activeCamId){
          const cam=savedCams.find(c=>c.id===activeCamId); if(cam) connectSavedCam(cam);
        }
      }
      }, delay);
    }

    // ================= audio capture =================
    function handleAudioChunk(input) {
      let sumSquares = 0;
      for (let i = 0; i < input.length; i++) sumSquares += input[i] * input[i];
      const rms = Math.sqrt(sumSquares / input.length);
      const db = rms > 0 ? 20 * Math.log10(rms) : -100;
      meterLevelDb = Math.max(-60, Math.min(0, db));
      if (meterLevelDb > meterPeakDb) {
        meterPeakDb = meterLevelDb;
      } else {
        meterPeakDb = Math.max(-60, meterPeakDb - 0.18);
      }
      updateMeterText();

      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(input.buffer);
        } catch (err) {
          console.error('[AUDIO] Send error:', err);
        }
      }
    }

    async function setupAudioCapture() {
      // AudioWorklet preferred; ScriptProcessor fallback.
      const workletCode = `
        class MicCapture extends AudioWorkletProcessor {
          process(inputs) {
            const channel = inputs[0] && inputs[0][0];
            if (channel && channel.length) {
              const copy = new Float32Array(channel.length);
              copy.set(channel);
              this.port.postMessage(copy);
            }
            return true;
          }
        }
        registerProcessor('mic-capture', MicCapture);
      `;
      try {
        const blobUrl = URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' }));
        await audioContext.audioWorklet.addModule(blobUrl);
        audioWorkletNode = new AudioWorkletNode(audioContext, 'mic-capture');
        audioWorkletNode.port.onmessage = (e) => {
          if (e.data instanceof Float32Array) handleAudioChunk(e.data);
        };
        mediaSource.connect(audioWorkletNode);
        console.log('[AUDIO] Using AudioWorklet capture');
        return;
      } catch (err) {
        console.warn('[AUDIO] AudioWorklet unavailable, falling back to ScriptProcessor:', err);
      }

      scriptNode = audioContext.createScriptProcessor(4096, 1, 1);
      scriptNode.onaudioprocess = (e) => {
        const input = e.inputBuffer.getChannelData(0);
        handleAudioChunk(new Float32Array(input));
      };
      mediaSource.connect(scriptNode);
      scriptNode.connect(audioContext.destination);
    }

    async function startCamera() {
      updateStatus('Requesting camera and microphone...');

      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 } },
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      if (!stream.getAudioTracks() || stream.getAudioTracks().length === 0) {
        throw new Error('Microphone access is required. Please allow microphone access and try again.');
      }

      video.srcObject = stream;
      updateStatus('Camera and microphone access granted');
      meterLevelDb = -100;
      meterPeakDb = -100;
      updateMeterText();
      if (!meterAnimationFrame) drawAudioMeter();

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') await audioContext.resume();
      mediaSource = audioContext.createMediaStreamSource(stream);
      await setupAudioCapture();
    }

    // ================= frame capture =================
    function captureFrame() {
      if (!running || !video.videoWidth) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      // Backpressure: skip while the server is catching up.
      if (pendingFrames > MAX_PENDING) {
        droppedFrames++;
        if (droppedFrames % 30 === 1) updateStats();
        return;
      }

      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

      frameCount++;
      pendingFrames++;
      try {
        captureCtx.canvas.toBlob((blob) => {
          if (!blob) {
            pendingFrames = Math.max(0, pendingFrames - 1);
            frameCount = Math.max(0, frameCount - 1);
            return;
          }
          ws.send(blob);
          if (frameCount % 30 === 0) updateStats();
        }, 'image/jpeg', clientSendQuality);
      } catch (err) {
        console.error('[CAPTURE] Send error:', err);
        pendingFrames = Math.max(0, pendingFrames - 1);
        frameCount = Math.max(0, frameCount - 1);
      }
    }

    function startCaptureLoop() {
      captureCanvas = document.createElement('canvas');
      captureCtx = captureCanvas.getContext('2d');

      if (video.requestVideoFrameCallback) {
        const loop = () => {
          if (!running) return;
          captureFrame();
          video.requestVideoFrameCallback(loop);
        };
        video.requestVideoFrameCallback(loop);
      } else {
        captureTimer = setInterval(captureFrame, 33);
      }
    }

    // ================= start / stop =================
    function stopEverything() {
      running = false;
      clearTimeout(reconnectTimer);
      reconnectTimer = null;

      if (ws) {
        const socket = ws;
        ws = null;
        socket.onclose = null;
        socket.onerror = null;
        try { socket.close(); } catch (err) { /* ignore */ }
      }
      if (captureTimer) { clearInterval(captureTimer); captureTimer = null; }
      if (audioWorkletNode) { audioWorkletNode.port.onmessage = null; audioWorkletNode.disconnect(); audioWorkletNode = null; }
      if (scriptNode) { scriptNode.onaudioprocess = null; scriptNode.disconnect(); scriptNode = null; }
      if (mediaSource) { mediaSource.disconnect(); mediaSource = null; }
      if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      processed.removeAttribute('src');
      if (processedSrcUrl) { URL.revokeObjectURL(processedSrcUrl); processedSrcUrl = null; }
      document.body.classList.remove('on', 'ip-cam', 'rtsp-cam', 'onvif-cam', 'network-cam');
      camSource = 'local';
      updateFullscreenButton();

      frameCount = 0;
      responseCount = 0;
      droppedFrames = 0;
      pendingFrames = 0;
      meterLevelDb = -100;
      meterPeakDb = -100;
      updateMeterText();
      updateStats();
      updateStatus('Stopped');
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;

      running = true;
      document.body.classList.add('on');
      wake();
      frameCount = 0;
      responseCount = 0;
      droppedFrames = 0;
      pendingFrames = 0;
      reconnectAttempts = 0;

      try {
        if (camSource === 'ip') {
          await resolveBackend();
          connectWs();
        } else {
          await startCamera();
          await resolveBackend();
          connectWs();
          startCaptureLoop();
        }
      } catch (err) {
        console.error('[CAMERA]', err);
        updateStatus('Camera error: ' + err.message, true);
        running = false;
        document.body.classList.remove('on');
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    });

    stopBtn.addEventListener('click', () => {
      stopEverything();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    // ================= slider fill =================
    function paintRange(el) {
      el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%');
    }
    [qualityRange, gainRange].forEach((el) => {
      paintRange(el);
      el.addEventListener('input', () => paintRange(el));
    });

    // ================= settings panel =================
    const settingsBtn = document.getElementById('settingsBtn');
    const panel = document.getElementById('panel');
    function setPanel(open) {
      panel.classList.toggle('open', open);
      settingsBtn.classList.toggle('on', open);
      if (open) setCamPanel(false);
    }
    settingsBtn.addEventListener('click', () => setPanel(!panel.classList.contains('open')));
    document.addEventListener('pointerdown', (e) => {
      if (!panel.contains(e.target) && !settingsBtn.contains(e.target)) setPanel(false);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setPanel(false); });

    // ================= camera panel =================
    let camSource = 'local'; // 'local' | 'ip' | 'onvif' | 'rtsp'
    function setCamPanel(open) {
      cameraPanel.classList.toggle('open', open);
      cameraBtn.classList.toggle('on', open);
      if (open) setPanel(false);
    }
    cameraBtn.addEventListener('click', (e) => { e.stopPropagation(); setCamPanel(!cameraPanel.classList.contains('open')); });
    camLocalBtn.addEventListener('click', () => { selectCamSource('local'); });
    camIpBtn.addEventListener('click', () => { selectCamSource('ip'); });
    camOnvifBtn.addEventListener('click', () => { selectCamSource('onvif'); });
    camRtspBtn.addEventListener('click', () => { selectCamSource('rtsp'); });
    document.addEventListener('pointerdown', (e) => {
      if (!cameraPanel.contains(e.target) && !cameraBtn.contains(e.target)) setCamPanel(false);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setCamPanel(false); });

    function selectCamSource(source) {
      camSource = source;
      camLocalBtn.classList.toggle('camTabActive', source === 'local');
      camIpBtn.classList.toggle('camTabActive', source === 'ip');
      camOnvifBtn.classList.toggle('camTabActive', source === 'onvif');
      camRtspBtn.classList.toggle('camTabActive', source === 'rtsp');
      camIpRow.style.display = source === 'ip' ? 'flex' : 'none';
      camOnvifRow.style.display = source === 'onvif' ? 'flex' : 'none';
      camRtspRow.style.display = source === 'rtsp' ? 'flex' : 'none';
    if (camSource === 'local') {
      addSavedCam('Local Camera', 'local', '');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'camera_source', source: 'local' }));
      }
    }
    }

    async function connectIpCamera() {
      const url = camIpUrl.value.trim();
      if (!url) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        updateStatus('WebSocket not connected', true);
        return;
      }
      ws.send(JSON.stringify({ type: 'camera_source', source: 'ip', url }));
      camConnectBtn.textContent = 'Connecting…';
      addSavedCam('IP Camera', 'ip', url);
    }
    camConnectBtn.addEventListener('click', connectIpCamera);
    camIpUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectIpCamera(); });

    function connectOnvifCamera() {
      const host = camOnvifHost.value.trim();
      const port = camOnvifPort.value.trim() || '80';
      const user = camOnvifUser.value.trim();
      const pass = camOnvifPass.value.trim();
      if (!host) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        updateStatus('WebSocket not connected', true);
        return;
      }
      let url = `http://${host}:${port}/onvif/snapshot`;
      if (user) {
        url = `http://${user}:${pass}@${host}:${port}/onvif/snapshot`;
      }
      ws.send(JSON.stringify({ type: 'camera_source', source: 'onvif', url }));
      camOnvifConnectBtn.textContent = 'Connecting…';
      addSavedCam('ONVIF Camera', 'onvif', url);
    }
    camOnvifConnectBtn.addEventListener('click', connectOnvifCamera);
    [camOnvifHost, camOnvifPort, camOnvifUser, camOnvifPass].forEach(el => {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectOnvifCamera(); });
    });

    function connectRtspCamera() {
      let url = camRtspUrl.value.trim();
      if (!url) return;
      if (!/^rtsp:\/\//i.test(url)) url = 'rtsp://' + url;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        updateStatus('WebSocket not connected', true);
        return;
      }
      ws.send(JSON.stringify({ type: 'camera_source', source: 'rtsp', url }));
      camRtspConnectBtn.textContent = 'Connecting…';
      addSavedCam('RTSP Camera', 'rtsp', url);
    }
    camRtspConnectBtn.addEventListener('click', connectRtspCamera);
    camRtspUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectRtspCamera(); });

    // ================= idle chrome =================
    let hideTimer = null;
    function wake() {
      document.body.classList.remove('idle');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        const busy = dock.matches(':hover') || dock.contains(document.activeElement) || panel.classList.contains('open') || cameraPanel.classList.contains('open');
        if (running && !busy) document.body.classList.add('idle');
      }, 2500);
    }
    ['mousemove', 'keydown', 'touchstart', 'pointerdown'].forEach((ev) =>
      document.addEventListener(ev, wake, { passive: true }));

    // ================= camera preview: drag anywhere, minimize to a side =================
    const pip = document.getElementById('pip');
    const pipMinBtn = document.getElementById('pipMin');
    const EDGE_TAB = 34;
    let pipX = 0, pipY = 64, pipMin = null, drag = null;

    pip.style.cursor = 'grab';

    function placePip() {
      const w = pip.offsetWidth, h = pip.offsetHeight;
      pipY = Math.max(12, Math.min(pipY, window.innerHeight - h - 12));
      if (pipMin) {
        pip.style.left = (pipMin === 'l' ? -(w - EDGE_TAB) : window.innerWidth - EDGE_TAB) + 'px';
      } else {
        pipX = Math.max(12, Math.min(pipX, window.innerWidth - w - 12));
        pip.style.left = pipX + 'px';
      }
      pip.style.top = pipY + 'px';
      pip.classList.toggle('min', !!pipMin);
      pip.dataset.side = pipMin || '';
      pip.dataset.half = (pip.offsetLeft + w / 2 < window.innerWidth / 2) ? 'l' : 'r';
    }

    pip.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.pip-min') || e.target.closest('.camList')) return;
      pip.setPointerCapture(e.pointerId);
      drag = { sx: e.clientX, sy: e.clientY, ox: pip.offsetLeft, oy: pip.offsetTop, moved: false };
      pip.style.transition = 'none';
      pip.classList.add('dragging');
    });
    pip.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
      if (!drag.moved) return;
      pip.style.left = (drag.ox + dx) + 'px';
      pip.style.top = (drag.oy + dy) + 'px';
    });
    function endDrag() {
      if (!drag) return;
      const d = drag;
      drag = null;
      pip.style.transition = '';
      pip.classList.remove('dragging');
      if (!d.moved) {                       // plain click on the side tab restores it
        if (pipMin) { pipMin = null; placePip(); }
        return;
      }
      const left = pip.offsetLeft, w = pip.offsetWidth;
      pipY = pip.offsetTop;
      if (left < -w * 0.4) pipMin = 'l';                         // dragged off the left edge
      else if (left + w > window.innerWidth + w * 0.4) pipMin = 'r';   // ...or the right edge
      else { pipMin = null; pipX = left; }
      placePip();
    }
    pip.addEventListener('pointerup', endDrag);
    pip.addEventListener('pointercancel', endDrag);

    pipMinBtn.addEventListener('click', () => {
      pipMin = pip.dataset.half === 'l' ? 'l' : 'r';
      placePip();
    });
    window.addEventListener('resize', placePip);
    pipX = window.innerWidth - pip.offsetWidth - 22;
    placePip();

    // ================= meter size =================
    function sizeMeter() { audioMeter.height = Math.max(60, Math.round(window.innerHeight * 0.28)); }
    sizeMeter();
    window.addEventListener('resize', sizeMeter);

    // ================= init =================
    updateStatus('Ready. Click Start to begin.');
    updateStats();
    updateMeterText();
    updateFullscreenButton();
    drawAudioMeter();
  </script>
</body>
</html>
