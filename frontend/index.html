<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Feed Quantizer</title>
<style>
:root{--lvl:0;--e:cubic-bezier(.22,1,.36,1);--s:cubic-bezier(.34,1.56,.64,1);--mut:rgba(255,255,255,.55);--line:rgba(255,255,255,.16);--ok:#5ee3a1;--warn:#ffb86b;--bad:#ff6b6b}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;color:#f4f4f8;font:13px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
body.idle{cursor:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
input,select{font:inherit}

#grid{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body.ov #grid{z-index:2;mix-blend-mode:screen;pointer-events:none}
#cv{position:fixed;z-index:1;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s var(--e)}
body.on #cv{opacity:1}
#hint{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--mut);pointer-events:none;transition:opacity .5s;animation:pulse 3.4s ease-in-out infinite;text-align:center;padding:24px}
body.on #hint{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.45}}

.glass{background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.ui{transition:opacity .5s var(--e),transform .7s var(--e)}
body.idle .ui{opacity:0;transform:translateY(14px)}
body.idle #top{transform:translateY(-14px)}
body.idle.err .ui{opacity:1;transform:none}

#top{position:fixed;top:16px;left:16px;z-index:5;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:99px;max-width:calc(100vw - 32px)}
#dot{width:7px;height:7px;border-radius:50%;background:var(--mut);transition:background .4s;flex:none}
body.on #dot{background:var(--ok);animation:ping 1.8s ease-out infinite}
body.err #dot{background:var(--bad);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,227,161,.6)}100%{box-shadow:0 0 0 9px rgba(94,227,161,0)}}
#st,#fps,#srcState{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.err #st{color:#ff8b8b}
#srcState{display:none}
@media(min-width:760px){#srcState{display:inline}}

#dock{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:6;display:flex;align-items:center;gap:10px;padding:9px;border-radius:34px;max-width:96vw;
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.go,.ic{display:grid;place-items:center;border-radius:50%;transition:transform .45s var(--s),background .2s}
.go{width:54px;height:54px;background:#fff;color:#000;flex:none}
.ic{width:42px;height:42px;background:rgba(255,255,255,.1);flex:none}
.ic:hover{background:rgba(255,255,255,.2)}.ic.on{background:#fff;color:#000}
.go:hover,.ic:hover{transform:scale(1.08)}.go:active,.ic:active{transform:scale(.9)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go svg{fill:currentColor;stroke:none;width:22px;height:22px}
.go .s,body.on .go .p{display:none}body.on .go .s{display:block}

.seg{position:relative;display:flex;padding:4px;border-radius:99px;background:rgba(0,0,0,.25);overflow-x:auto;scrollbar-width:none;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg .hl{position:absolute;left:0;top:4px;bottom:4px;border-radius:99px;background:#fff;transition:transform .55s var(--s),width .55s var(--s)}
.seg button{position:relative;padding:9px 14px;border-radius:99px;white-space:nowrap;color:var(--mut);transition:color .3s}
.seg button.on{color:#000;font-weight:600}
#sw{display:none;gap:3px;padding:0 4px}
body.on #sw{display:flex}
#sw span{width:8px;height:30px;border-radius:4px}

#tune,#sources,#integrations-panel{position:fixed;left:50%;bottom:104px;translate:-50% 0;z-index:7;width:min(420px,94vw);max-height:min(74vh,660px);overflow:auto;display:grid;gap:14px;padding:18px;border-radius:24px;
  opacity:0;transform:translateY(10px) scale(.94);transform-origin:50% 100%;pointer-events:none;transition:opacity .25s,transform .55s var(--s)}
#tune{width:min(330px,90vw)}
#tune.open,#sources.open,#integrations-panel.open{opacity:1;transform:none;pointer-events:auto}
body.idle #tune.open,body.idle #sources.open,body.idle #integrations-panel.open{opacity:0}
#sources label,#tune label,#integrations-panel label{display:grid;gap:6px;color:var(--mut);font-size:12px}
#sources select,#tune select,#integrations-panel select,#sources input[type=text],#sources input[type=password],#integrations-panel input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:inherit}
#devNote{color:var(--mut);font-size:11px}
.ic.off{opacity:.4}
.row{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:10px}
.row label{color:var(--mut)}.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;cursor:pointer;background:linear-gradient(90deg,#fff var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{font-size:15px;font-weight:600}
.field{display:grid;gap:6px}
.field>span,.field>label{color:var(--mut);font-size:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid var(--line);transition:background .2s,transform .2s}
.btn:hover{background:rgba(255,255,255,.22)}.btn:active{transform:scale(.97)}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.danger{color:#ffb4b4;border-color:rgba(255,107,107,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:8px}
.hintline{color:var(--mut);font-size:11px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.12);color:var(--mut);white-space:nowrap}
.badge.live{background:rgba(94,227,161,.18);color:var(--ok)}
.badge.err{background:rgba(255,107,107,.18);color:var(--bad)}
.badge.warn{background:rgba(255,184,107,.18);color:var(--warn)}
.badge.bridge{background:rgba(107,168,255,.18);color:#9cc4ff}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18)}
.item .meta{display:grid;gap:3px;min-width:0}
.item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabpane{display:grid;gap:14px}
.tabpane[hidden]{display:none}
details{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(0,0,0,.14)}
summary{cursor:pointer;color:var(--mut);font-size:12px}
details .inner{margin-top:10px;display:grid;gap:10px}
.mic-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.mic-row:first-child{border-top:0}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ee3a1,#ffd166,#ff6b6b);border-radius:3px;transition:width .06s linear}
.checkline{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.checkline input{width:auto}
.notice{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,184,107,.35);background:rgba(255,184,107,.09);font-size:12px;line-height:1.5;color:#ffd9ad}
.notice.info{border-color:rgba(107,168,255,.35);background:rgba(107,168,255,.09);color:#cfe3ff}
.notice.bad{border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.09);color:#ffc4c4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.codebox{letter-spacing:.24em;font-size:22px;font-weight:700;text-align:center;padding:10px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.qr{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px;width:max-content;margin:0 auto}
.qr canvas{display:block}

@media(max-width:640px){body.on #sw,#fps{display:none}.ic{width:38px;height:38px}#mr,#gd,#fs,#integration{display:none}.seg button{padding:9px 11px}#sources,#tune,#integrations-panel{bottom:92px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="grid"></canvas>
<canvas id="cv"></canvas>
<video id="vid" playsinline muted style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<div id="hint">Press start</div>

<div class="glass ui" id="top"><span id="dot"></span><b>Live Feed Quantizer</b><span id="st">Ready</span><span id="srcState"></span><span id="fps"></span></div>

<div class="glass ui" id="tune">
  <div class="row"><label for="sPix">Pixels</label><input id="sPix" type="range" min="2" max="40" step="1" value="10"><output></output></div>
  <div class="row"><label for="sSens">Sense</label><input id="sSens" type="range" min=".3" max="3" step=".1" value="1"><output></output></div>
  <div class="row"><label for="sResp">Flow</label><input id="sResp" type="range" min=".03" max=".5" step=".01" value=".12"><output></output></div>
  <div class="row"><label>Preset</label><input id="presetName" type="text" placeholder="name" style="flex:1"><button class="btn sm" id="presetSave">Save</button></div>
  <div class="row"><label>Load</label><select id="presetList" style="flex:1"></select><button class="btn sm" id="presetLoad">Load</button></div>
</div>

<div class="glass ui" id="sources">
  <div class="panel-head"><h3>Sources</h3><button class="ic" id="close-sources" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="seg" id="srcTabs" style="width:100%"></div>
  <div id="srcTabContent"></div>
</div>

<div class="glass ui" id="integrations-panel">
  <div class="panel-head"><h3>Integrations</h3><button class="ic" id="close-integrations" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="seg" id="integration-tabs" style="width:100%"></div>
  <div id="integration-tab-content"></div>
</div>

<div class="glass ui" id="dock">
  <button class="go" id="go" aria-label="Start / stop"><svg class="p" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="s" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
  <div class="seg" id="seg"><i class="hl"></i></div>
  <div id="sw"></div>
  <button class="ic" id="srcBtn" title="Sources" aria-label="Sources"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
  <button class="ic" id="micBtn" title="Microphone (mute)" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
  <button class="ic" id="tb" title="Tune" aria-label="Tune"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button class="ic on" id="mr" title="Mirror (M)" aria-label="Mirror"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/></svg></button>
  <button class="ic" id="gd" title="Grid overlay (G)" aria-label="Grid overlay"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="18" cy="6" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18" cy="12" r="1.4"/><circle cx="6" cy="18" r="1.4"/><circle cx="12" cy="18" r="1.4"/><circle cx="18" cy="18" r="1.4"/></svg></button>
  <button class="ic" id="fs" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ic" id="integration" title="Integrations" aria-label="Integrations"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.5"/></svg></button>
</div>

<script>
/* =========================================================================
   Live Feed Quantizer — client architecture
   FrameSource: LocalCamera | RemoteDevice (WebRTC) | BridgeFeed (WS JPEG)
   AudioSource: local mic | remote track | silent
   The browser owns the palette and all five WebGL modes for every source.
   ========================================================================= */
const $ = s => document.querySelector(s);
const cv = $('#cv'), vid = $('#vid'), body = document.body;
const MODES = ['Palette', 'Dither', 'Halftone', 'Gradient', 'Ripple'];
const PRESETS = Array.from({ length: 5 }, () => ({ pix: 10, sens: 1, resp: 0.12 }));
let S = PRESETS[0];
let mode = 0, mirror = 1, ov = false, run = false;
const selected = { video: '', audio: '' };
let micMuted = false;

/* ---------- backend resolver (single source of truth) ---------- */
const BACKEND_PORT = 8001;
const BRIDGE_PORTS = [8765, 8766, 8767];
function resolveBackend() {
  const qp = new URLSearchParams(location.search);
  const override = qp.get('backend');
  if (override) {
    const value = /^https?:\/\//i.test(override) ? override : `http://${override}`;
    return value.replace(/\/$/, '');
  }
  if (location.protocol === 'https:') return location.origin;
  if (location.port === '5500') return `http://${location.hostname}:${BACKEND_PORT}`;
  return location.origin;
}
function wsURL(path) {
  const base = resolveBackend();
  const url = new URL(path, base);
  url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  return url.toString();
}
function bridgeURL(port, path = '') {
  return `http://127.0.0.1:${port}${path}`;
}
const BACKEND = resolveBackend();

/* ---------- persistence: schema v2 + legacy migration ---------- */
const LS_V2 = 'lfq_sources_v2';
const LS_LEGACY = 'savedCams';
let store = { v: 2, sources: [], activeId: null, activeAudioDeviceId: null };
function uid() {
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 's_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function normalizeSource(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const kind = raw.kind || (raw.source === 'local' ? 'local' : 'network');
  if (kind === 'local') {
    return { id: raw.id || uid(), kind: 'local', name: raw.name || 'Local camera', deviceId: raw.deviceId || '', audioDeviceId: raw.audioDeviceId || '' };
  }
  if (kind === 'remote') {
    return { id: raw.id || uid(), kind: 'remote', name: raw.name || 'Remote device', roomCode: raw.roomCode || '', peerId: raw.peerId || '' };
  }
  return {
    id: raw.id || uid(), kind: 'network', name: raw.name || 'Network camera',
    protocol: raw.protocol || 'rtsp', url: raw.url || '',
    rememberCredential: !!raw.rememberCredential
  };
}
function loadStore() {
  let loaded = null;
  try { loaded = JSON.parse(localStorage.getItem(LS_V2) || 'null'); } catch (e) {}
  if (loaded && loaded.v === 2 && Array.isArray(loaded.sources)) {
    store = {
      v: 2,
      sources: loaded.sources.map(normalizeSource).filter(Boolean),
      activeId: loaded.activeId || null,
      activeAudioDeviceId: loaded.activeAudioDeviceId || null
    };
    return;
  }
  // Migrate the legacy savedCams array once.
  let legacy = [];
  try { legacy = JSON.parse(localStorage.getItem(LS_LEGACY) || '[]'); } catch (e) {}
  if (Array.isArray(legacy) && legacy.length) {
    store.sources = legacy.map(cam => normalizeSource({
      id: cam.id, kind: 'network', name: cam.name || 'Saved camera',
      protocol: cam.source === 'ip' ? 'ip' : (cam.protocol || cam.source || 'rtsp'),
      url: cam.url || ''
    })).filter(Boolean);
    store.activeId = legacy.find(c => c.id === store.activeId) ? store.activeId : null;
    saveStore();
  }
}
let saveTimer = 0;
function saveStore() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_V2, JSON.stringify(store)); } catch (e) {}
  }, 120);
}
function activeSource() {
  return store.sources.find(s => s.id === store.activeId) || null;
}
function upsertSource(src) {
  const existing = store.sources.findIndex(s => s.id === src.id);
  if (existing >= 0) store.sources[existing] = { ...store.sources[existing], ...src };
  else store.sources.push(src);
  saveStore();
  return src;
}
function removeSource(id) {
  store.sources = store.sources.filter(s => s.id !== id);
  if (store.activeId === id) store.activeId = null;
  saveStore();
  renderSources();
}

/* ---------- source state machine ---------- */
class StateMachine {
  constructor() { this.state = 'idle'; this.detail = ''; this.listeners = new Set(); }
  set(state, detail = '') {
    if (this.state === state && this.detail === detail) return;
    this.state = state; this.detail = detail;
    this.listeners.forEach(fn => { try { fn(state, detail); } catch (e) { console.error(e); } });
  }
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
}
function backoffDelay(attempt) { return Math.min(5000, 500 * Math.pow(2, Math.min(attempt, 4))); }

class FrameSource {
  constructor(id) {
    this.id = id;
    this.sm = new StateMachine();
    this.running = false;
    this._attempt = 0;
    this._timer = null;
  }
  async start() {
    if (this.running) return;
    this.running = true;
    this._attempt = 0;
    await this._connect();
  }
  stop() {
    this.running = false;
    clearTimeout(this._timer);
    this._timer = null;
    this._disconnect();
    this.sm.set('idle');
  }
  _scheduleReconnect(err) {
    if (!this.running) return;
    const delay = backoffDelay(this._attempt++);
    this.sm.set('reconnecting', `${err || 'connection lost'} · retry ${(delay / 1000).toFixed(1)}s`);
    clearTimeout(this._timer);
    this._timer = setTimeout(() => { if (this.running) this._connect(); }, delay);
  }
  _connect() {}
  _disconnect() {}
  frame() { return null; }
  size() { return [0, 0]; }
  releaseFrame() {}
  label() { return 'Source'; }
}

class LocalCameraSource extends FrameSource {
  constructor(id, deviceId) {
    super(id);
    this.deviceId = deviceId || '';
    this.stream = null;
    this.video = vid;
  }
  async _connect() {
    this.sm.set('connecting');
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Camera access needs https or localhost');
      }
      const video = { width: { ideal: 1280 }, height: { ideal: 720 } };
      if (this.deviceId) video.deviceId = { exact: this.deviceId };
      const stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
      this.stream = stream;
      const track = stream.getVideoTracks()[0];
      if (track) {
        const settings = track.getSettings ? track.getSettings() : {};
        if (settings.deviceId) { this.deviceId = settings.deviceId; selected.video = settings.deviceId; }
        track.addEventListener('ended', () => {
          if (!this.running) return;
          this._disconnect();
          this._scheduleReconnect('camera disconnected');
        });
      }
      this.video.srcObject = stream;
      this.video.muted = true;
      await this.video.play().catch(() => {});
      this._attempt = 0;
      this.sm.set('live');
      refreshDevices();
    } catch (err) {
      this.sm.set('error', errorText(err));
      const fatal = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      if (!fatal) this._scheduleReconnect(errorText(err));
    }
  }
  _disconnect() {
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = null;
    if (this.video.srcObject) this.video.srcObject = null;
  }
  frame() {
    return (this.video.readyState >= 2 && this.video.videoWidth) ? this.video : null;
  }
  size() { return [this.video.videoWidth || 0, this.video.videoHeight || 0]; }
  label() { return 'Local camera'; }
}

class AudioSource {
  constructor(id) { this.id = id; this.sm = new StateMachine(); this.analyser = null; }
  async start() {}
  stop() {}
  get isLive() { return this.sm.state === 'live'; }
}

class LocalMicSource extends AudioSource {
  constructor(id, deviceId, opts = {}) {
    super(id);
    this.deviceId = deviceId || '';
    this.opts = opts;
    this.stream = null;
    this.ctx = null;

      if (audioSource) { audioSource.stop(); audioSource = null; }
      await connectAudio(mic.deviceId);
      const sel = $('#micSelect'); if (sel) sel.value = mic.deviceId;
      syncSourceState();
    };
    row.appendChild(test); row.appendChild(use);
    host.appendChild(row);
  });
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

/* ---------- sources panel ---------- */
let sourceTab = 'local';
const sourcesPanel = $('#sources');
const srcTabs = $('#srcTabs');
const srcTabContent = $('#srcTabContent');
const SOURCE_TABS = [
  ['local', 'Local'], ['remote', 'Remote'], ['network', 'Network'], ['saved', 'Saved']
];
SOURCE_TABS.forEach(([key, label]) => {
  const b = document.createElement('button'); b.textContent = label; b.dataset.tab = key;
  b.onclick = () => { sourceTab = key; renderSources(); };
  srcTabs.appendChild(b);
});
function renderSources() {
  [...srcTabs.children].forEach(b => b.classList.toggle('on', b.dataset.tab === sourceTab));
  if (sourceTab === 'local') renderLocalTab();
  else if (sourceTab === 'remote') renderRemoteTab();
  else if (sourceTab === 'network') renderNetworkTab();
  else renderSavedTab();
}
function renderLocalTab() {
  srcTabContent.innerHTML = `
    <div class="tabpane" id="tab-local">
      <div class="field"><span>Camera</span><select id="camSelect"></select></div>
      <div class="field"><span>Microphone</span><select id="micSelect"></select></div>
      <div class="inline">
        <button class="btn primary" id="enableDevices">Enable camera &amp; mic</button>
        <button class="btn" id="saveLocal">Save this source</button>
      </div>
      <small class="hintline" id="devNote"></small>
      <div class="checkline"><input type="checkbox" id="micMute"> <label for="micMute" style="display:inline">Mute microphone</label></div>
      <details open>
        <summary>Microphone quality &amp; comparison</summary>
        <div class="inner">
          <div class="checkline"><input type="checkbox" id="qEcho"> <label for="qEcho" style="display:inline">Echo cancellation</label></div>
          <div class="checkline"><input type="checkbox" id="qNoise"> <label for="qNoise" style="display:inline">Noise suppression</label></div>
          <div class="checkline"><input type="checkbox" id="qAgc"> <label for="qAgc" style="display:inline">Auto gain (flattens dynamics)</label></div>
          <div class="field"><span>Sample rate</span><select id="qRate">
            <option value="0">Device default</option><option value="48000">48 kHz</option><option value="44100">44.1 kHz</option>
          </select></div>
          <div><div class="hintline">Active mic level</div><div class="meter"><i id="activeMicLevel"></i></div></div>
          <div id="micProbeList" class="list"></div>
        </div>
      </details>
      <div class="hintline">Any camera can be paired with any microphone. Switching one does not restart the other.</div>
    </div>`;
  const camSelect = $('#camSelect'), micSelect = $('#micSelect');
  camSelect.onchange = async () => {
    selected.video = camSelect.value;
    const src = currentLocalSource();
    src.deviceId = camSelect.value;
    upsertSource(src);
    store.activeId = src.id;
    if (run) await connectVideo(src);
    renderSavedTab();
  };
  micSelect.onchange = async () => {
    selected.audio = micSelect.value;
    store.activeAudioDeviceId = micSelect.value;
    const src = currentLocalSource();
    src.audioDeviceId = micSelect.value;
    upsertSource(src);
    saveStore();
    if (run) await connectAudio(micSelect.value);
  };
  $('#enableDevices').onclick = requestPermissions;
  $('#saveLocal').onclick = () => {
    const src = { id: uid(), kind: 'local', name: 'Local camera', deviceId: selected.video || '', audioDeviceId: selected.audio || '' };
    upsertSource(src); store.activeId = src.id; saveStore(); renderSources();
    status('Source saved');
  };
  $('#micMute').checked = micMuted;
  $('#micMute').onchange = () => toggleMic();
  $('#qEcho').checked = micQuality.echoCancellation;
  $('#qNoise').checked = micQuality.noiseSuppression;
  $('#qAgc').checked = micQuality.autoGainControl;
  $('#qRate').value = String(micQuality.sampleRate || 0);
  $('#qEcho').onchange = e => { micQuality.echoCancellation = e.target.checked; if (audioSource) reconnectAudio(); };
  $('#qNoise').onchange = e => { micQuality.noiseSuppression = e.target.checked; if (audioSource) reconnectAudio(); };
  $('#qAgc').onchange = e => { micQuality.autoGainControl = e.target.checked; if (audioSource) reconnectAudio(); };
  $('#qRate').onchange = e => { micQuality.sampleRate = +e.target.value; if (audioSource) reconnectAudio(); };
  refreshDevices();
}
function reconnectAudio() {
  const id = selected.audio || (activeSource() && activeSource().audioDeviceId) || '';
  if (audioSource) { audioSource.stop(); audioSource = null; }
  connectAudio(id).then(syncSourceState);
}
function renderRemoteTab() {
  srcTabContent.innerHTML = `
    <div class="tabpane">
      <div class="notice info">Remote devices use WebRTC (Tier 0, no install). Create a room, show the QR code, and the phone becomes a source.</div>
      <div class="hintline">Signaling: <span class="mono">${escapeHtml(BACKEND)}</span></div>
      <button class="btn primary" id="createRoom" disabled>Create remote room (Phase 3)</button>
    </div>`;
}
function renderNetworkTab() {
  srcTabContent.innerHTML = `
    <div class="tabpane">
      <div class="notice">Browsers cannot speak multicast/UDP/RTSP or discover LAN devices. Network cameras and smart lights need the optional local <b>Bridge</b> app (Tier 1). Nothing on this page requires it.</div>
      <div class="field"><span>Bridge status</span><div id="bridgeStatus" class="hintline">Not checked yet.</div></div>
      <div class="inline"><button class="btn" id="findBridge">Find Bridge</button><button class="btn" id="installBridge">Install Bridge</button></div>
      <div class="field"><span>Manual URL (last resort)</span><input id="manualUrl" type="text" placeholder="rtsp://user:pass@192.168.1.50:554/stream"></div>
      <div class="inline"><button class="btn primary" id="addManual">Add network source</button></div>
      <div class="hintline">Discovery, credentials and bridge pairing arrive in Phases 4–6.</div>
    </div>`;
  $('#findBridge').onclick = () => probeBridge(true);
  $('#installBridge').onclick = () => showInstallBridge();
  $('#addManual').onclick = () => {
    const url = ($('#manualUrl').value || '').trim();
    if (!url) return;
    status('Network sources need the Bridge (Phase 4)', true);
  };
}
function renderSavedTab() {
  srcTabContent.innerHTML = '<div class="tabpane"><div id="savedList" class="list"></div></div>';
  const host = $('#savedList');
  if (!store.sources.length) {
    host.innerHTML = '<div class="hintline">No saved sources yet. Save a local source on the Local tab.</div>';
    return;
  }
  store.sources.forEach(src => {
    const row = document.createElement('div');
    row.className = 'item';
    const active = src.id === store.activeId;
    row.innerHTML = `<div class="meta"><div class="name">${escapeHtml(src.name)}</div><div class="sub">${escapeHtml(src.kind)}${active ? ' · active' : ''}</div></div>`;
    const actions = document.createElement('div'); actions.className = 'actions';
    const connect = document.createElement('button'); connect.className = 'btn sm primary'; connect.textContent = 'Connect';
    connect.onclick = () => connectSaved(src);
    const remove = document.createElement('button'); remove.className = 'btn sm danger'; remove.textContent = 'Remove';
    remove.onclick = () => { if (src.id === store.activeId && run) stop(); removeSource(src.id); };
    actions.appendChild(connect); actions.appendChild(remove);
    row.appendChild(actions); host.appendChild(row);
  });
}
function toggleSources(force) {
  const open = force === undefined ? !sourcesPanel.classList.contains('open') : force;
  sourcesPanel.classList.toggle('open', open);
  $('#srcBtn').classList.toggle('on', open);
  if (open) {
    closeTune(); closeIntegrations();
    if (sourceTab === 'local') renderSources();
    else renderSources();
    wake();
  }
}
$('#srcBtn').onclick = e => { e.stopPropagation(); toggleSources(); };
$('#close-sources').onclick = () => toggleSources(false);
document.addEventListener('pointerdown', e => {
  if (sourcesPanel.classList.contains('open') && !sourcesPanel.contains(e.target) && !$('#srcBtn').contains(e.target)) toggleSources(false);
});
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', () => {
    refreshDevices();
    if (run && videoSource && videoSource.sm.state !== 'live') videoSource.start();
  });
}

/* ---------- bridge detection (used from Phase 4 onward) ---------- */
let bridge = { found: false, port: null, token: null, version: null };
async function probeBridge(explain) {
  if (explain) {
    const statusEl = document.querySelector('#bridgeStatus');
    if (statusEl) statusEl.textContent = 'Checking 127.0.0.1:8765–8767 (first local request — your browser may ask for permission)…';
  }
  for (const port of BRIDGE_PORTS) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1200);
      const resp = await fetch(bridgeURL(port, '/health'), { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (resp.ok) {
        const data = await resp.json().catch(() => ({}));
        bridge = { found: true, port, token: bridge.token, version: data.version || null };
        const statusEl = document.querySelector('#bridgeStatus');
        if (statusEl) statusEl.textContent = `Bridge found on 127.0.0.1:${port}${data.version ? ' · v' + data.version : ''}.`;
        return true;
      }
    } catch (e) {}
  }
  bridge = { found: false, port: null, token: null, version: null };
  const statusEl = document.querySelector('#bridgeStatus');
  if (statusEl) statusEl.textContent = 'No Bridge found. Install it to use network cameras and local smart lights.';
  return false;
}
function showInstallBridge() {
  status('Bridge download is documented in BRIDGE_INSTALL.md (Phase 6)', true);
}

/* ---------- mic mute ---------- */
function toggleMic() {
  if (!audioSource || audioSource.sm.state !== 'live') {
    status(run ? 'No microphone available' : 'Start the feed to use the mic');
    return;
  }
  micMuted = !micMuted;
  if (audioSource.stream) audioSource.stream.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
  $('#micBtn').classList.toggle('off', micMuted);
  $('#micBtn').title = micMuted ? 'Microphone (muted)' : 'Microphone (mute)';
  const box = $('#micMute'); if (box) box.checked = micMuted;
  status(micMuted ? 'Mic muted' : 'Live');
}
$('#micBtn').onclick = e => { e.stopPropagation(); toggleMic(); };

/* ---------- modes / tune / grid / presets ---------- */
const seg = $('#seg'), hl = seg.firstElementChild;
MODES.forEach((m, i) => { const b = document.createElement('button'); b.textContent = m; b.onclick = () => setMode(i); seg.appendChild(b); });
function moveHl() { const b = seg.children[mode + 1]; if (!b) return; hl.style.width = b.offsetWidth + 'px'; hl.style.transform = `translateX(${b.offsetLeft}px)`; }
function setMode(i) {
  mode = i; [...seg.children].forEach((b, k) => b.classList.toggle('on', k === i + 1));
  const p = PRESETS[mode]; S = p;
  const sPix = document.getElementById('sPix'), sSens = document.getElementById('sSens'), sResp = document.getElementById('sResp');
  sPix.value = p.pix; sSens.value = p.sens; sResp.value = p.resp;
  [sPix, sSens, sResp].forEach(el => el.dispatchEvent(new Event('input')));
  moveHl(); seg.children[i + 1].scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
}
setMode(0); addEventListener('resize', moveHl); document.fonts && document.fonts.ready.then(moveHl);

const fmt = { sPix: v => v + 'px', sSens: v => (+v).toFixed(1) + '×', sResp: v => Math.round(v * 100) + '%' };
[['sPix', 'pix'], ['sSens', 'sens'], ['sResp', 'resp']].forEach(([id, key]) => {
  const el = $('#' + id), out = el.parentElement.querySelector('output');
  const sync = () => { S[key] = +el.value; PRESETS[mode][key] = S[key]; out.textContent = fmt[id](el.value); el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%'); };
  el.addEventListener('input', sync); sync();
});

const tune = $('#tune'), tb = $('#tb');
function closeTune() { tune.classList.remove('open'); tb.classList.remove('on'); }
tb.onclick = e => {
  e.stopPropagation();
  const open = !tune.classList.contains('open');
  tune.classList.toggle('open', open); tb.classList.toggle('on', open);
  if (open) { toggleSources(false); closeIntegrations(); }
};
document.addEventListener('pointerdown', e => {
  if (!tune.contains(e.target) && !tb.contains(e.target)) closeTune();
});

const presetName = document.getElementById('presetName');
const presetList = document.getElementById('presetList');
const presetSave = document.getElementById('presetSave');
const presetLoad = document.getElementById('presetLoad');
function refreshPresets() {
  const list = JSON.parse(localStorage.getItem('lfq_presets') || '[]');
  presetList.innerHTML = '';
  list.forEach(p => { const o = document.createElement('option'); o.value = p.name; o.textContent = p.name; presetList.appendChild(o); });
}
presetSave.onclick = () => {
  const name = presetName.value.trim(); if (!name) return;
  const list = JSON.parse(localStorage.getItem('lfq_presets') || '[]');
  const entry = { name, mode, pix: S.pix, sens: S.sens, resp: S.resp };
  const idx = list.findIndex(p => p.name === name); if (idx >= 0) list[idx] = entry; else list.push(entry);
  localStorage.setItem('lfq_presets', JSON.stringify(list)); refreshPresets();
};
presetLoad.onclick = () => {
  const name = presetList.value; if (!name) return;
  const list = JSON.parse(localStorage.getItem('lfq_presets') || '[]');
  const p = list.find(x => x.name === name); if (!p) return;
  setMode(p.mode);
  const sPix = document.getElementById('sPix'), sSens = document.getElementById('sSens'), sResp = document.getElementById('sResp');
  sPix.value = p.pix; sSens.value = p.sens; sResp.value = p.resp;
  [sPix, sSens, sResp].forEach(el => el.dispatchEvent(new Event('input')));
};
refreshPresets();

function toggleMirror() { mirror ^= 1; $('#mr').classList.toggle('on', !!mirror); }
function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
function toggleGrid() { ov = !ov; body.classList.toggle('ov', ov); $('#gd').classList.toggle('on', ov); }
$('#gd').onclick = toggleGrid; $('#mr').onclick = toggleMirror; $('#fs').onclick = toggleFs;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey) return;
  if (e.key >= '1' && e.key <= '5') setMode(+e.key - 1);
  else if (e.key === ' ') { e.preventDefault(); $('#go').click(); }
  else if (e.key === 'f') toggleFs(); else if (e.key === 'm') toggleMirror(); else if (e.key === 'g') toggleGrid();
});

/* ---------- integrations panel (expanded in Phase 7) ---------- */
let integrationsOpen = false;
const integrationPanel = $('#integrations-panel');
const integrationTabs = $('#integration-tabs');
const integrationContent = $('#integration-tab-content');
function toggleIntegrations(force) {
  integrationsOpen = force === undefined ? !integrationsOpen : force;
  integrationPanel.classList.toggle('open', integrationsOpen);
  $('#integration').classList.toggle('on', integrationsOpen);
  if (integrationsOpen) {
    toggleSources(false); closeTune();
    renderIntegrationTab(integrationTab); wake();
  }
}
function closeIntegrations() { toggleIntegrations(false); }
$('#integration').onclick = e => { e.stopPropagation(); toggleIntegrations(); };
$('#close-integrations').onclick = () => toggleIntegrations(false);
document.addEventListener('pointerdown', e => {
  if (integrationsOpen && !integrationPanel.contains(e.target) && !$('#integration').contains(e.target)) toggleIntegrations(false);
});

let integrationTab = 'bridge';
const INTEGRATION_TABS = [
  ['bridge', 'Bridge/Local'], ['cloud', 'Cloud'], ['devices', 'Devices'], ['google', 'Google']
];
INTEGRATION_TABS.forEach(([key, label]) => {
  const b = document.createElement('button'); b.textContent = label; b.dataset.tab = key;
  b.onclick = () => { integrationTab = key; renderIntegrationTab(key); };
  integrationTabs.appendChild(b);
});
function renderIntegrationTab(tab) {
  [...integrationTabs.children].forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'bridge') {
    integrationContent.innerHTML = `
      <div class="tabpane">
        <div class="hintline">Local smart lights are driven by the Bridge. The browser owns the audio→light mapping; the Bridge only sends frames to devices.</div>
        <button class="btn" id="findBridge2">Check Bridge</button>
        <div class="hintline" id="bridgeStatus2">Not checked yet.</div>
        <div class="hintline">WiZ is the first driver (UDP, no keys). Tuya local, Hue Entertainment, LIFX LAN, Govee LAN and Matter follow in Phase 7.</div>
      </div>`;
    $('#findBridge2').onclick = async () => { const ok = await probeBridge(true); const el = $('#bridgeStatus2'); if (el) el.textContent = ok ? 'Bridge reachable.' : 'Bridge not found.'; };
  } else if (tab === 'cloud') {
    integrationContent.innerHTML = '<div class="tabpane"><div class="notice info">Optional cloud slow mode (no Bridge) is beat-level only (≤ 2 updates/s) and labelled low-fidelity. It needs the hosted backend OAuth configuration.</div></div>';
  } else if (tab === 'devices') {
    integrationContent.innerHTML = '<div class="tabpane"><div class="hintline">Discovered lights appear here once the Bridge is running.</div></div>';
  } else {
    integrationContent.innerHTML = `<div class="tabpane"><div class="notice">Google Home cannot be controlled from a website: the Home APIs are native Android/iOS SDKs (preview, certification required). Use Matter or the device's native protocol through the Bridge instead.</div></div>`;
  }
}

/* ---------- idle cursor ---------- */
let hideT;
function wake() {
  body.classList.remove('idle'); clearTimeout(hideT);
  hideT = setTimeout(() => {
    if (run && !$('#dock').matches(':hover') && !tune.classList.contains('open') && !sourcesPanel.classList.contains('open') && !integrationsOpen) body.classList.add('idle');
  }, 3000);
}
['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* ---------- boot ---------- */
loadStore();
renderSources();
refreshDevices();
if ('mediaDevices' in navigator && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', refreshDevices);
}
</script>
