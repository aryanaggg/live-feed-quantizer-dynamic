<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Feed Quantizer</title>
<style>
:root{--lvl:0;--e:cubic-bezier(.22,1,.36,1);--s:cubic-bezier(.34,1.56,.64,1);--mut:rgba(255,255,255,.55);--line:rgba(255,255,255,.16);--ok:#5ee3a1;--warn:#ffb86b;--bad:#ff6b6b}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;color:#f4f4f8;font:13px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
body.idle{cursor:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
input,select{font:inherit}

#grid{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body.ov #grid{z-index:2;mix-blend-mode:screen;pointer-events:none}
#cv{position:fixed;z-index:1;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s var(--e)}
body.on #cv{opacity:1}
#hint{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--mut);pointer-events:none;transition:opacity .5s;animation:pulse 3.4s ease-in-out infinite;text-align:center;padding:24px}
body.on #hint{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.45}}

.glass{background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.ui{transition:opacity .5s var(--e),transform .7s var(--e)}
body.idle .ui{opacity:0;transform:translateY(14px)}
body.idle #top{transform:translateY(-14px)}
body.idle.err .ui{opacity:1;transform:none}

#top{position:fixed;top:16px;left:16px;z-index:5;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:99px;max-width:calc(100vw - 32px)}
#dot{width:7px;height:7px;border-radius:50%;background:var(--mut);transition:background .4s;flex:none}
body.on #dot{background:var(--ok);animation:ping 1.8s ease-out infinite}
body.err #dot{background:var(--bad);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(94,227,161,.6)}100%{box-shadow:0 0 0 9px rgba(94,227,161,0)}}
#st,#fps,#srcState{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.err #st{color:#ff8b8b}
#srcState{display:none}
@media(min-width:760px){#srcState{display:inline}}

#dock{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:6;display:flex;align-items:center;gap:10px;padding:9px;border-radius:34px;max-width:96vw;
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.go,.ic{display:grid;place-items:center;border-radius:50%;transition:transform .45s var(--s),background .2s}
.go{width:54px;height:54px;background:#fff;color:#000;flex:none}
.ic{width:42px;height:42px;background:rgba(255,255,255,.1);flex:none}
.ic:hover{background:rgba(255,255,255,.2)}.ic.on{background:#fff;color:#000}
.go:hover,.ic:hover{transform:scale(1.08)}.go:active,.ic:active{transform:scale(.9)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go svg{fill:currentColor;stroke:none;width:22px;height:22px}
.go .s,body.on .go .p{display:none}body.on .go .s{display:block}

.seg{position:relative;display:flex;padding:4px;border-radius:99px;background:rgba(0,0,0,.25);overflow-x:auto;scrollbar-width:none;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg .hl{position:absolute;left:0;top:4px;bottom:4px;border-radius:99px;background:#fff;transition:transform .55s var(--s),width .55s var(--s)}
.seg button{position:relative;padding:9px 14px;border-radius:99px;white-space:nowrap;color:var(--mut);transition:color .3s}
.seg button.on{color:#000;font-weight:600}
#sw{display:none;gap:3px;padding:0 4px}
body.on #sw{display:flex}
#sw span{width:8px;height:30px;border-radius:4px}

#tune,#sources,#integrations-panel{position:fixed;left:50%;bottom:104px;translate:-50% 0;z-index:7;width:min(420px,94vw);max-height:min(74vh,660px);overflow:auto;display:grid;gap:14px;padding:18px;border-radius:24px;
  opacity:0;transform:translateY(10px) scale(.94);transform-origin:50% 100%;pointer-events:none;transition:opacity .25s,transform .55s var(--s)}
#tune{width:min(330px,90vw)}
#tune.open,#sources.open,#integrations-panel.open{opacity:1;transform:none;pointer-events:auto}
body.idle #tune.open,body.idle #sources.open,body.idle #integrations-panel.open{opacity:0}
#sources label,#tune label,#integrations-panel label{display:grid;gap:6px;color:var(--mut);font-size:12px}
#sources select,#tune select,#integrations-panel select,#sources input[type=text],#sources input[type=password],#integrations-panel input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:inherit}
#devNote{color:var(--mut);font-size:11px}
.ic.off{opacity:.4}
.row{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:10px}
.row label{color:var(--mut)}.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;cursor:pointer;background:linear-gradient(90deg,#fff var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{font-size:15px;font-weight:600}
.field{display:grid;gap:6px}
.field>span,.field>label{color:var(--mut);font-size:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid var(--line);transition:background .2s,transform .2s}
.btn:hover{background:rgba(255,255,255,.22)}.btn:active{transform:scale(.97)}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.danger{color:#ffb4b4;border-color:rgba(255,107,107,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:8px}
.hintline{color:var(--mut);font-size:11px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.12);color:var(--mut);white-space:nowrap}
.badge.live{background:rgba(94,227,161,.18);color:var(--ok)}
.badge.err{background:rgba(255,107,107,.18);color:var(--bad)}
.badge.warn{background:rgba(255,184,107,.18);color:var(--warn)}
.badge.bridge{background:rgba(107,168,255,.18);color:#9cc4ff}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18)}
.item .meta{display:grid;gap:3px;min-width:0}
.item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabpane{display:grid;gap:14px}
.tabpane[hidden]{display:none}
details{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(0,0,0,.14)}
summary{cursor:pointer;color:var(--mut);font-size:12px}
details .inner{margin-top:10px;display:grid;gap:10px}
.mic-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.mic-row:first-child{border-top:0}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ee3a1,#ffd166,#ff6b6b);border-radius:3px;transition:width .06s linear}
.checkline{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.checkline input{width:auto}
.notice{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,184,107,.35);background:rgba(255,184,107,.09);font-size:12px;line-height:1.5;color:#ffd9ad}
.notice.info{border-color:rgba(107,168,255,.35);background:rgba(107,168,255,.09);color:#cfe3ff}
.notice.bad{border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.09);color:#ffc4c4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.codebox{letter-spacing:.24em;font-size:22px;font-weight:700;text-align:center;padding:10px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.qr{display:grid;place-items:center;padding:10px;background:#fff;border-radius:12px;width:max-content;margin:0 auto}
.qr canvas{display:block}

@media(max-width:640px){body.on #sw,#fps{display:none}.ic{width:38px;height:38px}#mr,#gd,#fs,#integration{display:none}.seg button{padding:9px 11px}#sources,#tune,#integrations-panel{bottom:92px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="grid"></canvas>
<canvas id="cv"></canvas>
<video id="vid" playsinline muted style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<div id="hint">Press start</div>

<div class="glass" id="joinBar" hidden style="position:fixed;top:16px;right:16px;z-index:9;padding:12px 14px;border-radius:16px;display:flex;gap:12px;align-items:center;max-width:min(560px,94vw)">
  <div style="min-width:0"><b id="joinTitle">Share this device</b><div id="joinNote" class="hintline">Allow camera and microphone to join the room.</div></div>
  <button class="btn primary" id="joinShare">Share</button>
</div>

<div class="glass ui" id="top"><span id="dot"></span><b>Live Feed Quantizer</b><span id="st">Ready</span><span id="srcState"></span><span id="fps"></span></div>

<div class="glass ui" id="tune">
  <div class="row"><label for="sPix">Pixels</label><input id="sPix" type="range" min="2" max="40" step="1" value="10"><output></output></div>
  <div class="row"><label for="sSens">Sense</label><input id="sSens" type="range" min=".3" max="3" step=".1" value="1"><output></output></div>
  <div class="row"><label for="sResp">Flow</label><input id="sResp" type="range" min=".03" max=".5" step=".01" value=".12"><output></output></div>
  <div class="row"><label>Preset</label><input id="presetName" type="text" placeholder="name" style="flex:1"><button class="btn sm" id="presetSave">Save</button></div>
  <div class="row"><label>Load</label><select id="presetList" style="flex:1"></select><button class="btn sm" id="presetLoad">Load</button></div>
</div>

<div class="glass ui" id="sources">
  <div class="panel-head"><h3>Sources</h3><button class="ic" id="close-sources" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="seg" id="srcTabs" style="width:100%"></div>
  <div id="srcTabContent"></div>
</div>

<div class="glass ui" id="integrations-panel">
  <div class="panel-head"><h3>Integrations</h3><button class="ic" id="close-integrations" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="seg" id="integration-tabs" style="width:100%"></div>
  <div id="integration-tab-content"></div>
</div>

<div class="glass ui" id="dock">
  <button class="go" id="go" aria-label="Start / stop"><svg class="p" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="s" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
  <div class="seg" id="seg"><i class="hl"></i></div>
  <div id="sw"></div>
  <button class="ic" id="srcBtn" title="Sources" aria-label="Sources"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
  <button class="ic" id="micBtn" title="Microphone (mute)" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
  <button class="ic" id="tb" title="Tune" aria-label="Tune"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button class="ic on" id="mr" title="Mirror (M)" aria-label="Mirror"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/></svg></button>
  <button class="ic" id="gd" title="Grid overlay (G)" aria-label="Grid overlay"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="18" cy="6" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18" cy="12" r="1.4"/><circle cx="6" cy="18" r="1.4"/><circle cx="12" cy="18" r="1.4"/><circle cx="18" cy="18" r="1.4"/></svg></button>
  <button class="ic" id="fs" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ic" id="integration" title="Integrations" aria-label="Integrations"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="14" width="6.5" height="6.5" rx="1.5"/></svg></button>
</div>

              || (0 <= c && c <= 6 && (r == 0 || r == 6) )

          } else {

          }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

        }

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }

        if (_modules[6][c] != null) {
          continue;

      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          if (_modules[row][col] != null) {

          }

          for (var r = -2; r <= 2; r += 1) {

                  || (r == 0 && c == 0) ) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical

        if (i < 6) {
          _modules[i][8] = mod;

    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

            row -= inc;

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        var b2 = read();
        var b3 = read();

      var bytes = [];

        if (c < 128) {
          bytes.push(c);

let ac = null, an = null, fd = null, sr = 48000;

/* ---------- mic panel: quality, per-mic visualizer ---------- */
const localProbe = { stream: null, ctx: null, analyser: null, data: null, raf: 0, bar: null, deviceId: null };
function stopMicProbe() {
  cancelAnimationFrame(localProbe.raf); localProbe.raf = 0;
  if (localProbe.stream) localProbe.stream.getTracks().forEach(t => t.stop());
  if (localProbe.ctx) localProbe.ctx.close().catch(() => {});
  localProbe.stream = null; localProbe.ctx = null; localProbe.analyser = null; localProbe.bar = null; localProbe.deviceId = null;
}
async function startMicProbe(deviceId, bar) {
  stopMicProbe();
  localProbe.bar = bar;
  bar.style.width = '0%';
  try {
    const audio = { echoCancellation: !!micQuality.echoCancellation, noiseSuppression: !!micQuality.noiseSuppression, autoGainControl: !!micQuality.autoGainControl };
    if (deviceId) audio.deviceId = { exact: deviceId };
    localProbe.stream = await navigator.mediaDevices.getUserMedia({ audio, video: false });
    localProbe.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await localProbe.ctx.resume().catch(() => {});
    localProbe.analyser = localProbe.ctx.createAnalyser();
    localProbe.analyser.fftSize = 1024;
    localProbe.ctx.createMediaStreamSource(localProbe.stream).connect(localProbe.analyser);
    localProbe.data = new Uint8Array(localProbe.analyser.fftSize);
    localProbe.deviceId = deviceId;
    const loop = () => {
      if (!localProbe.analyser) return;
      localProbe.analyser.getByteTimeDomainData(localProbe.data);
      let sum = 0;
      for (let i = 0; i < localProbe.data.length; i++) { const v = (localProbe.data[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / localProbe.data.length);
      if (localProbe.bar) localProbe.bar.style.width = Math.min(100, rms * 380) + '%';
      localProbe.raf = requestAnimationFrame(loop);
    };
    loop();
  } catch (err) {
    if (bar) bar.style.width = '0%';
    status('Mic test failed: ' + errorText(err), true);
  }
}
function updateActiveMicMeter() {

/* ---------- bridge detection (used from Phase 4 onward) ---------- */
let bridge = { found: false, port: null, token: null, version: null };
async function probeBridge(explain) {
  if (explain) {
    const statusEl = document.querySelector('#bridgeStatus');
    if (statusEl) statusEl.textContent = 'Checking 127.0.0.1:8765–8767 (first local request — your browser may ask for permission)…';
  }
  for (const port of BRIDGE_PORTS) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 1200);
      const resp = await fetch(bridgeURL(port, '/health'), { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (resp.ok) {
        const data = await resp.json().catch(() => ({}));
        bridge = { found: true, port, token: bridge.token, version: data.version || null };
        const statusEl = document.querySelector('#bridgeStatus');
        if (statusEl) statusEl.textContent = `Bridge found on 127.0.0.1:${port}${data.version ? ' · v' + data.version : ''}.`;
        return true;
      }
    } catch (e) {}
  }
  bridge = { found: false, port: null, token: null, version: null };
  const statusEl = document.querySelector('#bridgeStatus');
  if (statusEl) statusEl.textContent = 'No Bridge found. Install it to use network cameras and local smart lights.';
  return false;
}

  return `${caps.rate_mode || 'slow'} · ${caps.max_rate_hz} Hz`;
}
function renderLightDriverModes(capsByDriver) {
  const host = $('#lightDriverModes');
  if (!host) return;
  const rows = Object.entries(capsByDriver || {}).map(([name, caps]) =>
    `<div class="hintline">${escapeHtml(name)}: <span class="badge">${escapeHtml(lightDriverModeLabel(caps))}</span></div>`
  );
  host.innerHTML = rows.join('') || '<div class="hintline">No light drivers reported yet.</div>';
}
function renderIntegrationTab(tab) {
  [...integrationTabs.children].forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'bridge') {
    integrationContent.innerHTML = `
      <div class="tabpane">
        <div class="hintline">Local smart lights are driven by the Bridge. The browser owns the audio→light mapping; the Bridge only sends frames to devices.</div>
        <button class="btn" id="findBridge2">Check Bridge</button>
        <div class="hintline" id="bridgeStatus2">Not checked yet.</div>
        <div class="hintline">WiZ is the first driver (UDP, no keys). Tuya local, Hue Entertainment, LIFX LAN, Govee LAN and Matter follow in Phase 7.</div>
      </div>`;
    $('#findBridge2').onclick = async () => { const ok = await probeBridge(true); const el = $('#bridgeStatus2'); if (el) el.textContent = ok ? 'Bridge reachable.' : 'Bridge not found.'; };
  } else if (tab === 'cloud') {
    integrationContent.innerHTML = '<div class="tabpane"><div class="notice info">Optional cloud slow mode (no Bridge) is beat-level only (≤ 2 updates/s) and labelled low-fidelity. It needs the hosted backend OAuth configuration.</div></div>';
  } else if (tab === 'devices') {
    integrationContent.innerHTML = '<div class="tabpane"><div class="hintline">Discovered lights appear here once the Bridge is running.</div><div id="lightDriverModes"></div></div>';
    if (window.__lfqLightCaps) renderLightDriverModes(window.__lfqLightCaps);
  } else {
    integrationContent.innerHTML = `<div class="tabpane"><div class="notice">Google Home cannot be controlled from a website: the Home APIs are native Android/iOS SDKs (preview, certification required). Use Matter or the device's native protocol through the Bridge instead.</div></div>`;
  }
}

/* ---------- idle cursor ---------- */
let hideT;
function wake() {
  body.classList.remove('idle'); clearTimeout(hideT);
  hideT = setTimeout(() => {
    if (run && !$('#dock').matches(':hover') && !tune.classList.contains('open') && !sourcesPanel.classList.contains('open') && !integrationsOpen) body.classList.add('idle');
  }, 3000);
}
['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* ---------- boot ---------- */
loadStore();
renderSources();
refreshDevices();
if ('mediaDevices' in navigator && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', refreshDevices);
}

/* Remote join link: ?join=CODE.  The first camera/mic request happens only
   after the user clicks "Share" (never on load). */
const inviteCode = (new URLSearchParams(location.search).get('join') || '').trim().toUpperCase();
if (inviteCode) {
  const bar = $('#joinBar');
  bar.hidden = false;
  $('#joinTitle').textContent = 'Join room ' + inviteCode;
  $('#joinNote').textContent = 'Allow camera and microphone to share this device. Your browser will ask for permission.';
  $('#joinShare').textContent = 'Share camera & mic';
  $('#joinShare').onclick = async () => {
    if (guest.active) { leaveGuest(); $('#joinShare').textContent = 'Share camera & mic'; return; }
    await joinAsGuest(inviteCode);
    $('#joinShare').textContent = guest.active ? 'Stop sharing' : 'Share camera & mic';
  };
} else {
  $('#joinBar').hidden = true;
}
</script>
</body>
</html>
